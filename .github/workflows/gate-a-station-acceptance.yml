#
# Gate A -- the automated station-acceptance release gate.
#
# WHAT THIS PROVES: a clean Windows Sandbox install of a native-beta
# candidate kit, K1 activation, the station coming up and answering
# health/console/portal, both UIs actually rendering their SPA shell, the
# clerk loop (upload -> package -> approve/publish -> public listing), the
# offline caption pipeline producing real cues, the product egress engine
# (GStreamer, not the ffmpeg fallback) passing TSDuck transport-stream
# verification, and a bounded soak staying healthy -- judged by code
# (scripts/gate_a_verdict.py), fail-closed, from files a harness wrote, never
# from prose. See docs/ops/gate-a.md for the full verdict-criteria table with
# spec citations.
#
# WHAT THIS DOES NOT PROVE: the full station-acceptance ladder in
# docs/spec/3.0/civiccast-3.0-station-in-a-box-MASTER.md §12 -- the 24h/72h
# real-hardware soaks, physical SDI proof, unattended-reboot survival, the
# commissioning-wizard UI walkthrough, and OTT-app checks. Those remain
# "Gate B" (a separate, real-hardware 24h reboot soak) and the existing
# manual/Playwright acceptance work. Gate A is a fast, cheap, fail-closed
# floor that runs on every candidate build, not a replacement for either.
#
# DIRTY LANE <gate-a-dirty-lane>: a second job (station-acceptance-dirty,
# below) installs a pinned previous candidate, plants operator data, leaves
# that version live, then runs the current setup directly over it. Exact
# previous/current installer hashes and data survival are judged fail-closed.
# See that job's own header and docs/ops/gate-a.md, "Dirty lane".
#
# DOWNLOAD-ONLY LANE <gate-a-download-only-lane>: a third, REQUIRED job
# (station-acceptance-download-only, below) proves the download-only
# install/upgrade path the K1 fix silently broke -- since then,
# d4-activate-station requires a station\ folder beside setup.exe and aborts
# otherwise, so a download-only install (setup.exe + side-loaded packs\, no
# station\, reusing an already-activated station's cached model packs)
# stopped working and no other lane caught it because every other lane
# installs from the full kit (setup.exe + packs\ + station\). Owner decision
# 2026-09-02: this lane is required for every release from now on. See that
# job's own header and docs/ops/gate-a.md, "Download-only lane".
#
# STATUS: informational only. It reports its verdict on every candidate but
# does NOT block merges or releases until the owner promotes it to a required
# check after 3 consecutive green runs (docs/ops/gate-a.md, "Promotion
# rule"). No agent flips branch protection -- that is an owner-only action
# per this repo's CLAUDE.md "Owner gates" section.
#
# ARTIFACT DOWNLOAD: the ~21 GB native-beta-kit-<sha> artifact is fetched
# here, in the workflow, with actions/download-artifact@v4 (parallel,
# chunked) rather than inside Run-GateA.ps1 via `gh run download` (a single
# throttled stream measured at ~1.3 GB/10min -- ~2.5h per gate run). The
# resolved kit directory is handed to Run-GateA.ps1 via -KitDir; -RunId
# remains supported on the script itself for manual local use, where a
# slower single-stream `gh run download` is an acceptable trade for not
# needing a workflow around it.
#
# LOCAL-FIRST KIT: native-beta-candidate-artifacts.yml's build_target:
# self-hosted lane builds on THIS SAME box (self-hosted, windows,
# sandbox-lab) and writes the finished, flat kit layout (setup.exe +
# packs\ + station\) straight to C:\CivicCastTester\kit-staging\<sha>\ in
# addition to (by default, instead of) uploading the ~21 GB artifact. A
# "Reuse a locally pre-staged kit" step earlier in this job's history
# checks that exact path and junctions it into sandbox-lab/kit-staging/<sha>
# when present, skipping the download below entirely; anything that step
# doesn't find (an older candidate run, a hosted build, or a self-hosted
# build whose local path isn't on this particular box) falls through to the
# download unchanged.

name: gate-a-station-acceptance

on:
  workflow_run:
    workflows: [native-beta-candidate-artifacts]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Workflow run id of the native-beta-candidate-artifacts run to judge"
        required: true
        type: string
      lane:
        description: "Run the full gate, the cross-version lane only, or the download-only lane only (diagnostic reruns)"
        required: true
        type: choice
        options:
          - full
          - cross-version-only
          - download-only-only
        default: full

concurrency:
  # Shared with native-beta-candidate-artifacts.yml's build_target:
  # self-hosted lane (group: sandbox-lab there too) so a self-hosted candidate
  # build and a Gate A run never execute on this one physical box at the
  # same time -- the later one queues (cancel-in-progress: false) instead of
  # contending for the same hardware/Windows Sandbox feature. This also still
  # fully serializes Gate A runs against each other, as the old "gate-a" name
  # did.
  group: sandbox-lab
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  station-acceptance:
    name: Windows Sandbox station-acceptance run + verdict
    # Skip (neutral, not failed) when the triggering candidate build itself
    # did not succeed -- there is no installable kit to judge in that case,
    # and a Gate A FAIL on top of an already-red candidate build would be
    # noise, not signal.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.lane != 'cross-version-only' && inputs.lane != 'download-only-only') || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, windows, sandbox-lab]
    timeout-minutes: 180
    steps:
      # Belt-and-suspenders on top of Host-Launch-Sandbox-Test.ps1's own
      # teardown-drain (docs/ops/gate-a.md, "Teardown drain"): that drain
      # covers the run that just finished, but this self-hosted runner's
      # workspace persists across jobs, so if some future path skips or
      # exhausts that drain, a leftover VM from the PRIOR job could still be
      # releasing its VSMB handles on sandbox-lab/ the moment THIS job's
      # Checkout step starts. Observed on run 32929704614: Checkout's
      # workspace clean hit "EBUSY: resource busy or locked, rmdir
      # ...sandbox-lab/scripts" plus permission warnings under
      # hoststore\install\dependencies\ollama and runtime\python312.zip,
      # about a minute after the prior run (32926056071) reported job
      # SUCCESS while vmmemWindowsSandbox was still exiting.
      - name: Wait for prior run's workspace to be clean
        shell: pwsh
        timeout-minutes: 10
        run: |
          # No sandbox-lab\ from a prior checkout -- first run on this
          # workspace, nothing to wait on.
          if (-not (Test-Path 'sandbox-lab')) {
            Write-Host "No sandbox-lab/ present yet -- nothing to drain, proceeding to Checkout."
            exit 0
          }

          # Same rename-probe technique as Host-Launch-Sandbox-Test.ps1's own
          # teardown-drain (Test-DirectoryHandlesFree): renaming a directory
          # away and back is the exact operation Checkout's workspace clean
          # performs (rmdir/rename), so it fails closed on precisely the
          # handle that caused run 32929704614's EBUSY, not just on some file
          # inside the directory.
          function Test-DirectoryHandlesFree {
              param([string]$Path)
              if (-not (Test-Path -LiteralPath $Path)) { return $true }
              $parent = Split-Path -Parent $Path
              $leaf = Split-Path -Leaf $Path
              $probeLeaf = "$leaf.checkout-drain-probe-$([guid]::NewGuid().ToString('N'))"
              $probePath = Join-Path $parent $probeLeaf
              try {
                  Rename-Item -LiteralPath $Path -NewName $probeLeaf -ErrorAction Stop
              } catch {
                  return $false
              }
              try {
                  Rename-Item -LiteralPath $probePath -NewName $leaf -ErrorAction Stop
                  return $true
              } catch {
                  Start-Sleep -Milliseconds 500
                  try {
                      Rename-Item -LiteralPath $probePath -NewName $leaf -ErrorAction Stop
                  } catch {
                      Write-Warning "Could not rename $probePath back to $leaf -- left renamed for manual recovery: $_"
                  }
                  return $false
              }
          }

          # The subdirectories a prior Gate A run maps into Windows Sandbox
          # (sandbox-lab/CivicCastSandboxTest.wsb.template's MappedFolders) --
          # the exact set whose host directory handles VSMB can still be
          # holding open. kit-download/kit-staging are excluded: they hold
          # multi-GB junctions/trees where a false-negative EBUSY is far more
          # likely to come from ordinary size than from a held handle, and
          # they are not what run 32929704614 actually hit.
          $probeTargets = @('scripts', 'hoststore', 'output', 'soak-4h') |
              ForEach-Object { Join-Path 'sandbox-lab' $_ } |
              Where-Object { Test-Path $_ }

          if (-not $probeTargets) {
            Write-Host "sandbox-lab/ present but none of its mapped subfolders exist -- proceeding to Checkout."
            exit 0
          }

          $boundSeconds = 300
          $pollSeconds = 5
          $deadline = (Get-Date).AddSeconds($boundSeconds)
          $clean = $false
          $lastBusy = $null
          while ($true) {
              $busy = @($probeTargets | Where-Object { -not (Test-DirectoryHandlesFree -Path $_) })
              if ($busy.Count -eq 0) {
                  $clean = $true
                  break
              }
              $lastBusy = $busy -join ', '
              Write-Host "$((Get-Date).ToString('o')) waiting on prior run's teardown -- still locked: $lastBusy"
              if ((Get-Date) -ge $deadline) { break }
              Start-Sleep -Seconds $pollSeconds
          }

          if ($clean) {
              Write-Host "Workspace is clean -- all of $($probeTargets -join ', ') are rename-able. Proceeding to Checkout."
          } else {
              # Do not fail the job over this -- it is exactly the same
              # runner-hygiene, non-product condition
              # Host-Launch-Sandbox-Test.ps1's own drain marker describes.
              # Log clearly and let Checkout itself either succeed (the
              # handle may release in the gap) or fail with its own EBUSY,
              # which is at least now attributable to this wait having
              # already happened rather than a surprise.
              Write-Warning "Still waiting on prior run's teardown after ${boundSeconds}s (last locked: $lastBusy). Proceeding to Checkout anyway -- if it fails with EBUSY, re-run the job once the sandbox VM referenced in the runner's process list has fully exited."
          }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve target run id and candidate sha
        id: run_id
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $runId = "${{ github.event.inputs.run_id }}"
          if ([string]::IsNullOrWhiteSpace($runId)) {
            $runId = "${{ github.event.workflow_run.id }}"
          }
          if ([string]::IsNullOrWhiteSpace($runId)) {
            throw "Could not resolve a run id from either workflow_dispatch input or workflow_run event."
          }
          "run_id=$runId" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          # The workflow_run event carries the triggering run's head_sha for
          # free; workflow_dispatch (manual re-judge by run id) does not, so
          # resolve it the same way Run-GateA.ps1's own -RunId path always
          # has (gh run view). Either way this is the SAME sha
          # native-beta-candidate-artifacts.yml stamped into the
          # `native-beta-kit-<sha>` artifact name, which is what makes the
          # download step below able to name it precisely instead of
          # globbing.
          $sha = "${{ github.event.workflow_run.head_sha }}"
          if ([string]::IsNullOrWhiteSpace($sha)) {
            Write-Host "No workflow_run head_sha available (workflow_dispatch trigger) -- resolving via gh run view $runId."
            $runJson = & gh run view $runId -R "scottconverse/civiccast-native" --json headSha 2>&1
            if ($LASTEXITCODE -ne 0) {
              throw "gh run view $runId failed: $runJson"
            }
            $sha = ($runJson | ConvertFrom-Json).headSha
          }
          if ([string]::IsNullOrWhiteSpace($sha)) {
            throw "Could not resolve a candidate sha for run $runId."
          }
          "source_sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "run_id=$runId source_sha=$sha"

      - name: Clean previous kit-staging (21 GB/run -- keep only the current candidate)
        shell: pwsh
        run: |
          $stagingRoot = "sandbox-lab/kit-staging"
          $currentSha = "${{ steps.run_id.outputs.source_sha }}"
          if (Test-Path $stagingRoot) {
            Get-ChildItem -Path $stagingRoot -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -ne $currentSha } |
              ForEach-Object {
                Write-Host "Removing stale kit-staging dir: $($_.FullName)"
                if ($_.LinkType) {
                  # Junction (e.g. to C:\CivicCastTester\kit-staging): delete the
                  # link itself, never recurse into the target.
                  $_.Delete()
                } else {
                  Remove-Item -LiteralPath $_.FullName -Recurse -Force -ErrorAction SilentlyContinue
                }
              }
          } else {
            New-Item -ItemType Directory -Force -Path $stagingRoot | Out-Null
          }

      - name: Reuse a locally pre-staged kit when this box already has it
        id: local_kit
        shell: pwsh
        timeout-minutes: 10
        run: |
          # Artifact egress to this box measures ~1 GB per 8 minutes, so a 21 GB
          # kit takes ~3 h through any downloader. When an operator (or the
          # self-hosted candidate build) has already staged the kit under
          # C:\CivicCastTester\kit-staging\<sha>\, junction it in and skip the
          # download entirely. Validation of the kit layout stays in Run-GateA.
          $sha = "${{ steps.run_id.outputs.source_sha }}"
          $local = Join-Path "C:\CivicCastTester\kit-staging" $sha
          $target = Join-Path "sandbox-lab/kit-staging" $sha
          if ((Test-Path (Join-Path $local "station")) -and (Get-ChildItem $local -Filter "*setup.exe" -ErrorAction SilentlyContinue)) {
            New-Item -ItemType Directory -Force (Split-Path $target) | Out-Null
            if (Test-Path $target) { Remove-Item -LiteralPath $target -Recurse -Force -ErrorAction SilentlyContinue }
            New-Item -ItemType Junction -Path $target -Target $local | Out-Null
            Write-Host "Reusing locally staged kit: $local"
            "found=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "No locally staged kit at $local -- falling back to artifact download."
            "found=false" >> $env:GITHUB_OUTPUT
          }

      - name: Download the candidate kit artifact (parallel, chunked)
        if: steps.local_kit.outputs.found != 'true'
        uses: actions/download-artifact@v4
        timeout-minutes: 60
        with:
          name: native-beta-kit-${{ steps.run_id.outputs.source_sha }}
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: sandbox-lab/kit-staging/${{ steps.run_id.outputs.source_sha }}

      - name: Record the candidate's migration head (build time)
        id: expected_head
        shell: pwsh
        run: |
          # <gate-a-audit-BL-10> The judge's post-upgrade schema proof needs
          # an expected-head string whose origin is NOT the station under
          # test. PR #143's guard compared /health's schema_db_revision to
          # /health's schema_expected_head -- both from one SchemaStatus in
          # one process, and schema=="current" is DEFINED as those two being
          # equal -- so it was 1 whenever the station-up check passed and
          # could never fail. This step derives the head here, on the runner,
          # from the candidate's own migration files with a standard-library
          # parser (scripts/gate_a_expected_head.py -- no alembic, no
          # civiccast import, no database), and hands it to the gate as an
          # input. The other side of the comparison is the database's own
          # alembic_version row, read in the sandbox with psql.
          $head = & python scripts/gate_a_expected_head.py
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($head)) {
            Write-Error "Could not derive the candidate's migration head (exit $LASTEXITCODE). Gate A's post-upgrade schema proof requires it; refusing to run the lane with no independent expected head."
            exit 1
          }
          $head = $head.Trim()
          Write-Host "Candidate migration head (build time): $head"
          "head=$head" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Run Gate A
        id: gate_a
        shell: pwsh
        run: |
          # -TimeoutMinutes MUST stay above In-Sandbox-Report.ps1's own
          # -MaxScriptMinutes (150) so the in-sandbox watchdog is always the
          # first bound to fire and this host-side poll is the last resort.
          # An explicit value here overrides the script default, so it is a
          # fourth copy of that one setting -- tests/gate_a/
          # test_gate_a_harness_contract.py asserts this literal against the
          # script defaults and fails the build if they drift apart.
          pwsh -File sandbox-lab/Run-GateA.ps1 -KitDir "sandbox-lab/kit-staging/${{ steps.run_id.outputs.source_sha }}" -SourceSha "${{ steps.run_id.outputs.source_sha }}" -RunId ${{ steps.run_id.outputs.run_id }} -SoakMinutes 20 -TimeoutMinutes 170 -ExpectedMigrationHead "${{ steps.expected_head.outputs.head }}"
          $exitCode = $LASTEXITCODE
          "exit_code=$exitCode" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          # Locate the evidence dir this run just wrote so the upload step
          # below can find it without re-deriving the sha/timestamp logic.
          $latest = Get-ChildItem -Path "sandbox-lab/evidence" -Directory -Recurse -ErrorAction SilentlyContinue |
            Where-Object { Test-Path (Join-Path $_.FullName "gate-a-verdict.json") } |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($latest) {
            "evidence_dir=$($latest.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          exit $exitCode

      - name: Upload verdict
        if: always() && steps.gate_a.outputs.evidence_dir != ''
        uses: actions/upload-artifact@v4
        timeout-minutes: 30
        with:
          name: gate-a-verdict-${{ steps.run_id.outputs.run_id }}
          path: ${{ steps.gate_a.outputs.evidence_dir }}/gate-a-verdict.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload evidence
        if: always() && steps.gate_a.outputs.evidence_dir != ''
        uses: actions/upload-artifact@v4
        timeout-minutes: 30
        with:
          name: gate-a-${{ steps.run_id.outputs.run_id }}
          path: ${{ steps.gate_a.outputs.evidence_dir }}
          if-no-files-found: warn
          retention-days: 14

      - name: Fail the job on a non-PASS verdict or harness error
        if: always()
        shell: pwsh
        run: |
          $code = "${{ steps.gate_a.outputs.exit_code }}"
          if ($code -eq '0') {
            Write-Host "Gate A PASS."
            exit 0
          }

          # Windows Sandbox is a shared, single-instance-per-machine resource
          # on this runner -- an independent, unrelated build system also
          # launches it here. When Run-GateA.ps1 exits 2 with a BUSY verdict
          # (sandbox occupied by another process for the whole
          # -SandboxWaitMinutes wait window, harness never launched), that is
          # not a station-acceptance FAIL -- surface it as a distinctly
          # labeled, re-runnable failure rather than the generic message, and
          # do not auto-retry here: the launcher already spent its own wait
          # window, and this job's `concurrency: gate-a` group only ever
          # serializes OUR OWN Gate A runs, never the other party's, which is
          # invisible to GitHub.
          $verdict = $null
          $evidenceDir = "${{ steps.gate_a.outputs.evidence_dir }}"
          if ($evidenceDir -and (Test-Path (Join-Path $evidenceDir 'gate-a-verdict.json'))) {
            try {
              $verdict = (Get-Content -Path (Join-Path $evidenceDir 'gate-a-verdict.json') -Raw | ConvertFrom-Json).verdict
            } catch {
              Write-Warning "Could not parse gate-a-verdict.json to determine verdict: $_"
            }
          }

          if ($verdict -eq 'BUSY') {
            Write-Error "Gate A did not run: Windows Sandbox was busy (owned by another process on this shared runner, e.g. a rival build system) for the entire wait window, and the harness backed off cleanly without touching it. This is NOT a product failure -- re-run this workflow once the sandbox is free. See the uploaded gate-a-verdict / evidence artifacts (SANDBOX-WAIT.txt / SANDBOX-BUSY.txt)."
            exit 1
          }

          # The second non-verdict, from the same family as BUSY above: the
          # run DID launch and then lost its evidence channel -- the mapped
          # output folder stopped changing while the VM was still alive, so
          # Host-Launch-Sandbox-Test.ps1 wrote HOST-QUIET-SHARE.txt and the
          # judge returned HARNESS_ERROR. The job still fails so nobody reads
          # a red-free run as a PASS, but the message must not assert a
          # product finding that was never made.
          if ($verdict -eq 'HARNESS_ERROR') {
            Write-Error "Gate A produced no station-acceptance verdict: the sandbox's mapped output folder went quiet while the VM was alive, so the run's evidence never reached the host. This is NOT a candidate failure -- re-run this workflow. See gate-a-verdict.json's harness_error field and HOST-QUIET-SHARE.txt in the uploaded evidence artifact."
            exit 1
          }

          $verdictLabel = '<unknown>'
          if ($verdict) { $verdictLabel = $verdict }
          Write-Error "Gate A did not PASS (Run-GateA.ps1 exit code: $code, verdict: $verdictLabel). See the uploaded gate-a-verdict / evidence artifacts."
          exit 1

  # ==========================================================================
  # DIRTY-BOX REMNANT LANE <gate-a-dirty-lane>. Same candidate kit, same
  # sandbox, but the in-sandbox harness first installs the candidate, plants
  # operator data, REALLY uninstalls it, optionally seeds an orphaned
  # captions-large-v3 remnant, and then runs the full acceptance flow against
  # that remnant-carrying box -- the shape of every real customer upgrade
  # machine. Weeks of field failures (installers green in the pristine
  # sandbox, dead on machines carrying leftover ProgramData state; most
  # recently DESKTOP-2BR3SJR's 2026-08-30 #18 supervisor crash-loop on a
  # preserved-but-receiptless caption tier, fixed in PR #80) never had a CI
  # gate because Gate A's sandbox has no history. This lane is that gate.
  #
  # Runs AFTER the clean lane (needs:), on the same runner; the workflow's
  # `concurrency: sandbox-lab` group already serializes whole runs against
  # candidate builds. INFORMATIONAL like the clean lane -- the owner promotes
  # to required later. Timing contract: the dirty in-sandbox watchdog is 210
  # minutes (two install cycles), the host poll below is 230, and this job's
  # timeout-minutes must outlast 230 plus the up-to-90-minute shared-sandbox
  # wait window -- asserted by tests/gate_a/test_gate_a_harness_contract.py.
  # ==========================================================================
  station-acceptance-dirty:
    name: Cross-version install-over-existing lane + verdict
    needs: station-acceptance
    if: ${{ always() && ((github.event_name == 'workflow_dispatch' && (inputs.lane == 'cross-version-only' || needs.station-acceptance.result == 'success')) || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && needs.station-acceptance.result == 'success')) }}
    runs-on: [self-hosted, windows, sandbox-lab]
    timeout-minutes: 340
    steps:
      - name: Wait for prior run's workspace to be clean
        shell: pwsh
        timeout-minutes: 10
        run: |
          # Same rename-probe drain as the clean job above -- the clean lane
          # that just finished on this same runner may still be releasing its
          # VSMB handles when this job's Checkout starts. See that step's
          # comment for the observed EBUSY this prevents.
          if (-not (Test-Path 'sandbox-lab')) {
            Write-Host "No sandbox-lab/ present yet -- nothing to drain, proceeding to Checkout."
            exit 0
          }
          function Test-DirectoryHandlesFree {
              param([string]$Path)
              if (-not (Test-Path -LiteralPath $Path)) { return $true }
              $parent = Split-Path -Parent $Path
              $leaf = Split-Path -Leaf $Path
              $probeLeaf = "$leaf.checkout-drain-probe-$([guid]::NewGuid().ToString('N'))"
              $probePath = Join-Path $parent $probeLeaf
              try {
                  Rename-Item -LiteralPath $Path -NewName $probeLeaf -ErrorAction Stop
              } catch {
                  return $false
              }
              try {
                  Rename-Item -LiteralPath $probePath -NewName $leaf -ErrorAction Stop
                  return $true
              } catch {
                  Start-Sleep -Milliseconds 500
                  try {
                      Rename-Item -LiteralPath $probePath -NewName $leaf -ErrorAction Stop
                  } catch {
                      Write-Warning "Could not rename $probePath back to $leaf -- left renamed for manual recovery: $_"
                  }
                  return $false
              }
          }
          $probeTargets = @('scripts', 'hoststore', 'output', 'soak-4h') |
              ForEach-Object { Join-Path 'sandbox-lab' $_ } |
              Where-Object { Test-Path $_ }
          if (-not $probeTargets) {
            Write-Host "sandbox-lab/ present but none of its mapped subfolders exist -- proceeding to Checkout."
            exit 0
          }
          $deadline = (Get-Date).AddSeconds(300)
          while ($true) {
              $busy = @($probeTargets | Where-Object { -not (Test-DirectoryHandlesFree -Path $_) })
              if ($busy.Count -eq 0) { Write-Host "Workspace is clean."; break }
              Write-Host "$((Get-Date).ToString('o')) waiting on prior run's teardown -- still locked: $($busy -join ', ')"
              if ((Get-Date) -ge $deadline) { Write-Warning "Still locked after 300s -- proceeding to Checkout anyway."; break }
              Start-Sleep -Seconds 5
          }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve target run id and candidate sha
        id: run_id
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $runId = "${{ github.event.inputs.run_id }}"
          if ([string]::IsNullOrWhiteSpace($runId)) {
            $runId = "${{ github.event.workflow_run.id }}"
          }
          if ([string]::IsNullOrWhiteSpace($runId)) {
            throw "Could not resolve a run id from either workflow_dispatch input or workflow_run event."
          }
          "run_id=$runId" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $sha = "${{ github.event.workflow_run.head_sha }}"
          if ([string]::IsNullOrWhiteSpace($sha)) {
            Write-Host "No workflow_run head_sha available (workflow_dispatch trigger) -- resolving via gh run view $runId."
            $runJson = & gh run view $runId -R "scottconverse/civiccast-native" --json headSha 2>&1
            if ($LASTEXITCODE -ne 0) {
              throw "gh run view $runId failed: $runJson"
            }
            $sha = ($runJson | ConvertFrom-Json).headSha
          }
          if ([string]::IsNullOrWhiteSpace($sha)) {
            throw "Could not resolve a candidate sha for run $runId."
          }
          "source_sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "run_id=$runId source_sha=$sha"

      - name: Clean previous kit-staging (21 GB/run -- keep only the current candidate)
        shell: pwsh
        run: |
          $stagingRoot = "sandbox-lab/kit-staging"
          $currentSha = "${{ steps.run_id.outputs.source_sha }}"
          if (Test-Path $stagingRoot) {
            Get-ChildItem -Path $stagingRoot -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -ne $currentSha } |
              ForEach-Object {
                Write-Host "Removing stale kit-staging dir: $($_.FullName)"
                if ($_.LinkType) {
                  $_.Delete()
                } else {
                  Remove-Item -LiteralPath $_.FullName -Recurse -Force -ErrorAction SilentlyContinue
                }
              }
          } else {
            New-Item -ItemType Directory -Force -Path $stagingRoot | Out-Null
          }

      - name: Reuse a locally pre-staged kit when this box already has it
        id: local_kit
        shell: pwsh
        timeout-minutes: 10
        run: |
          $sha = "${{ steps.run_id.outputs.source_sha }}"
          $local = Join-Path "C:\CivicCastTester\kit-staging" $sha
          $target = Join-Path "sandbox-lab/kit-staging" $sha
          if ((Test-Path (Join-Path $local "station")) -and (Get-ChildItem $local -Filter "*setup.exe" -ErrorAction SilentlyContinue)) {
            New-Item -ItemType Directory -Force (Split-Path $target) | Out-Null
            if (Test-Path $target) { Remove-Item -LiteralPath $target -Recurse -Force -ErrorAction SilentlyContinue }
            New-Item -ItemType Junction -Path $target -Target $local | Out-Null
            Write-Host "Reusing locally staged kit: $local"
            "found=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "No locally staged kit at $local -- falling back to artifact download."
            "found=false" >> $env:GITHUB_OUTPUT
          }

      - name: Download the candidate kit artifact (parallel, chunked)
        if: steps.local_kit.outputs.found != 'true'
        uses: actions/download-artifact@v4
        timeout-minutes: 60
        with:
          name: native-beta-kit-${{ steps.run_id.outputs.source_sha }}
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: sandbox-lab/kit-staging/${{ steps.run_id.outputs.source_sha }}

      - name: Resolve and verify immutable previous candidate
        id: upgrade_baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $baselinePath = "sandbox-lab/upgrade-baseline.json"
          $baseline = Get-Content -LiteralPath $baselinePath -Raw | ConvertFrom-Json
          if ($baseline.schema_version -ne 2) { throw "Unsupported upgrade baseline schema: $($baseline.schema_version)" }
          $previousSha = [string]$baseline.source_sha
          $previousRunId = [string]$baseline.run_id
          $previousInstallerSha256 = [string]$baseline.installer_sha256
          $previousStationIndexSha256 = [string]$baseline.station_index_sha256
          $previousProductVersion = [string]$baseline.product_version
          if ($previousSha -notmatch '^[0-9a-f]{40}$' -or $previousRunId -notmatch '^\d+$') {
            throw "Invalid immutable previous candidate identity in $baselinePath"
          }
          if ($previousInstallerSha256 -notmatch '^[0-9a-f]{64}$' -or $previousStationIndexSha256 -notmatch '^[0-9a-f]{64}$' -or $previousProductVersion -notmatch '^[0-9A-Za-z][0-9A-Za-z.+-]*$') {
            throw "Invalid immutable previous candidate byte/version identity in $baselinePath"
          }
          if ($previousSha -eq "${{ steps.run_id.outputs.source_sha }}") {
            throw "Pinned previous source SHA equals the current candidate; this would be a same-candidate reinstall."
          }
          $runJson = & gh run view $previousRunId -R "scottconverse/civiccast-native" --json headSha,workflowName,conclusion,status 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Could not verify pinned previous candidate run ${previousRunId}: $runJson" }
          $run = $runJson | ConvertFrom-Json
          if ($run.headSha -ne $previousSha -or $run.workflowName -ne 'native-beta-candidate-artifacts' -or $run.conclusion -ne 'success') {
            throw "Pinned previous candidate identity mismatch: expected sha=$previousSha workflow=native-beta-candidate-artifacts conclusion=success; got sha=$($run.headSha) workflow=$($run.workflowName) conclusion=$($run.conclusion)"
          }
          "previous_source_sha=$previousSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "previous_run_id=$previousRunId" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "previous_installer_sha256=$previousInstallerSha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "previous_station_index_sha256=$previousStationIndexSha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "previous_product_version=$previousProductVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Verified previous candidate: label=$($baseline.candidate_label) run_id=$previousRunId source_sha=$previousSha product_version=$previousProductVersion gate_a_run_id=$($baseline.gate_a_run_id)"

      - name: Require the pinned previous full kit from local staging
        shell: pwsh
        run: |
          # Candidate #23 was built on the self-hosted runner with large-kit
          # upload disabled. Its complete, already-verified kit is retained
          # in the runner's local staging mirror; the small candidate artifact
          # is not a substitute for these bytes. Fail closed if it is absent.
          $previousSha = "${{ steps.upgrade_baseline.outputs.previous_source_sha }}"
          $local = Join-Path "C:\CivicCastTester\kit-staging" $previousSha
          $targetRoot = "sandbox-lab/previous-kit-staging"
          $target = Join-Path $targetRoot $previousSha
          $installers = @(Get-ChildItem -LiteralPath $local -Filter "*setup.exe" -File -ErrorAction SilentlyContinue)
          $stationIndexPath = Join-Path $local "station\station-index.json"
          if (-not (Test-Path $stationIndexPath) -or $installers.Count -ne 1) {
            throw "Previous full kit is absent or incomplete at $local; refusing to substitute a different candidate or partial artifact."
          }
          $installer = $installers[0]
          $installerHash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $stationIndexHash = (Get-FileHash -LiteralPath $stationIndexPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $installerVersion = ([System.Diagnostics.FileVersionInfo]::GetVersionInfo($installer.FullName).ProductVersion).Trim()
          $stationIndex = Get-Content -LiteralPath $stationIndexPath -Raw | ConvertFrom-Json
          $stationVersion = [string]$stationIndex.manifest.product_version
          $expectedInstallerHash = "${{ steps.upgrade_baseline.outputs.previous_installer_sha256 }}"
          $expectedStationIndexHash = "${{ steps.upgrade_baseline.outputs.previous_station_index_sha256 }}"
          $expectedVersion = "${{ steps.upgrade_baseline.outputs.previous_product_version }}"
          if ($installerHash -ne $expectedInstallerHash -or $stationIndexHash -ne $expectedStationIndexHash -or $installerVersion -ne $expectedVersion -or $stationVersion -ne $expectedVersion) {
            throw "Previous local kit identity mismatch: installer_sha256=$installerHash (expected $expectedInstallerHash), station_index_sha256=$stationIndexHash (expected $expectedStationIndexHash), installer_version=$installerVersion station_version=$stationVersion (expected $expectedVersion)."
          }
          New-Item -ItemType Directory -Force -Path $targetRoot | Out-Null
          if (Test-Path $target) {
            $item = Get-Item -LiteralPath $target -Force
            if ($item.LinkType) { $item.Delete() } else { Remove-Item -LiteralPath $target -Recurse -Force }
          }
          New-Item -ItemType Junction -Path $target -Target $local | Out-Null
          Write-Host "Pinned byte-verified previous full kit: $target -> $local (installer_sha256=$installerHash station_index_sha256=$stationIndexHash product_version=$expectedVersion)"

      - name: Record the candidate's migration head (build time)
        id: expected_head
        shell: pwsh
        run: |
          # <gate-a-audit-BL-10> The judge's post-upgrade schema proof needs
          # an expected-head string whose origin is NOT the station under
          # test. PR #143's guard compared /health's schema_db_revision to
          # /health's schema_expected_head -- both from one SchemaStatus in
          # one process, and schema=="current" is DEFINED as those two being
          # equal -- so it was 1 whenever the station-up check passed and
          # could never fail. This step derives the head here, on the runner,
          # from the candidate's own migration files with a standard-library
          # parser (scripts/gate_a_expected_head.py -- no alembic, no
          # civiccast import, no database), and hands it to the gate as an
          # input. The other side of the comparison is the database's own
          # alembic_version row, read in the sandbox with psql.
          $head = & python scripts/gate_a_expected_head.py
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($head)) {
            Write-Error "Could not derive the candidate's migration head (exit $LASTEXITCODE). Gate A's post-upgrade schema proof requires it; refusing to run the lane with no independent expected head."
            exit 1
          }
          $head = $head.Trim()
          Write-Host "Candidate migration head (build time): $head"
          "head=$head" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Run Gate A (dirty lane)
        id: gate_a_dirty
        shell: pwsh
        run: |
          # Dirty-lane timing contract: the in-sandbox watchdog raises itself
          # to 210 minutes when DIRTY_MODE.txt is present, so -TimeoutMinutes
          # here MUST stay above 210 (210 < 230, the dirty analogue of the
          # clean lane's 150 < 170 -- asserted by tests/gate_a/
          # test_gate_a_harness_contract.py). -SoakMinutes 10 keeps the total
          # two-install-cycle run inside that bound; the clean lane already
          # soaked this same candidate for 20.
          pwsh -File sandbox-lab/Run-GateA.ps1 -KitDir "sandbox-lab/kit-staging/${{ steps.run_id.outputs.source_sha }}" -SourceSha "${{ steps.run_id.outputs.source_sha }}" -RunId ${{ steps.run_id.outputs.run_id }} -DirtyLane -PreviousKitDir "sandbox-lab/previous-kit-staging/${{ steps.upgrade_baseline.outputs.previous_source_sha }}" -PreviousSourceSha "${{ steps.upgrade_baseline.outputs.previous_source_sha }}" -SoakMinutes 10 -TimeoutMinutes 230 -ExpectedMigrationHead "${{ steps.expected_head.outputs.head }}"
          $exitCode = $LASTEXITCODE
          "exit_code=$exitCode" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $latest = Get-ChildItem -Path "sandbox-lab/evidence" -Directory -Recurse -ErrorAction SilentlyContinue |
            Where-Object { Test-Path (Join-Path $_.FullName "gate-a-verdict.json") } |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($latest) {
            "evidence_dir=$($latest.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          exit $exitCode

      - name: Publish the dirty-lane verdict to the run summary
        if: always()
        shell: pwsh
        run: |
          # The dirty lane's whole point is loud visibility -- put the verdict
          # (including the SKIP status of any uncovered remnant shape) on the
          # run's front page, not just inside an artifact.
          $evidenceDir = "${{ steps.gate_a_dirty.outputs.evidence_dir }}"
          $lines = @("## Gate A dirty lane (cross-version install over existing)", "")
          $verdictPath = if ($evidenceDir) { Join-Path $evidenceDir 'gate-a-verdict.json' } else { $null }
          if ($verdictPath -and (Test-Path $verdictPath)) {
            try {
              $v = Get-Content -Path $verdictPath -Raw | ConvertFrom-Json
              $lines += "**Verdict: $($v.verdict)** (lane: $($v.lane))"
              $lines += ""
              $lines += "| check | status | detail |"
              $lines += "| --- | --- | --- |"
              foreach ($prop in $v.checks.PSObject.Properties) {
                $detail = ($prop.Value.detail -replace '\|', '\|')
                $lines += "| $($prop.Name) | $($prop.Value.status) | $detail |"
              }
              if (($v.checks.PSObject.Properties | Where-Object { $_.Value.status -eq 'SKIP' })) {
                $lines += ""
                $lines += "> :warning: One or more remnant shapes were **NOT covered** this run (status SKIP above). See docs/ops/gate-a.md, 'Dirty lane'."
              }
            } catch {
              $lines += "Could not parse gate-a-verdict.json: $_"
            }
          } else {
            $lines += "No gate-a-verdict.json was produced (exit code: ${{ steps.gate_a_dirty.outputs.exit_code }})."
          }
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload dirty-lane verdict
        if: always() && steps.gate_a_dirty.outputs.evidence_dir != ''
        uses: actions/upload-artifact@v4
        timeout-minutes: 30
        with:
          name: gate-a-dirty-verdict-${{ steps.run_id.outputs.run_id }}
          path: ${{ steps.gate_a_dirty.outputs.evidence_dir }}/gate-a-verdict.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload dirty-lane evidence
        if: always() && steps.gate_a_dirty.outputs.evidence_dir != ''
        uses: actions/upload-artifact@v4
        timeout-minutes: 30
        with:
          name: gate-a-dirty-${{ steps.run_id.outputs.run_id }}
          path: ${{ steps.gate_a_dirty.outputs.evidence_dir }}
          if-no-files-found: warn
          retention-days: 14

      - name: Unlink the pinned previous-kit junction (never leave it for the next checkout)
        if: always()
        shell: pwsh
        run: |
          # The junction under sandbox-lab/previous-kit-staging points INTO the
          # runner's durable C:\CivicCastTester\kit-staging\<previous sha>. Left
          # behind, the next run's actions/checkout `git clean -ffdx` walks
          # through it and deletes the real pinned kit (observed 2026-09-02:
          # candidate #23's 26 GB kit vanished after run 33584290436, and the
          # next cross-version lane failed closed on "previous full kit is
          # absent"). Remove ONLY the link, never the target.
          $root = "sandbox-lab/previous-kit-staging"
          if (Test-Path $root) {
            Get-ChildItem -LiteralPath $root -Force -ErrorAction SilentlyContinue | ForEach-Object {
              if ($_.LinkType) {
                Write-Host "Unlinking previous-kit junction: $($_.FullName) -> $($_.Target)"
                $_.Delete()
              } else {
                Write-Warning "Not a junction, leaving in place for inspection: $($_.FullName)"
              }
            }
          }

      - name: Fail the job on a non-PASS verdict or harness error
        if: always()
        shell: pwsh
        run: |
          # Same BUSY / HARNESS_ERROR discrimination as the clean job above --
          # neither is a station-acceptance finding, and neither may read as a
          # dirty-lane product failure.
          $code = "${{ steps.gate_a_dirty.outputs.exit_code }}"
          if ($code -eq '0') {
            Write-Host "Gate A dirty lane PASS."
            exit 0
          }
          $verdict = $null
          $evidenceDir = "${{ steps.gate_a_dirty.outputs.evidence_dir }}"
          if ($evidenceDir -and (Test-Path (Join-Path $evidenceDir 'gate-a-verdict.json'))) {
            try {
              $verdict = (Get-Content -Path (Join-Path $evidenceDir 'gate-a-verdict.json') -Raw | ConvertFrom-Json).verdict
            } catch {
              Write-Warning "Could not parse gate-a-verdict.json to determine verdict: $_"
            }
          }
          if ($verdict -eq 'BUSY') {
            Write-Error "Gate A dirty lane did not run: Windows Sandbox was busy for the entire wait window. NOT a product failure -- re-run this workflow once the sandbox is free."
            exit 1
          }
          if ($verdict -eq 'HARNESS_ERROR') {
            Write-Error "Gate A dirty lane produced no station-acceptance verdict: the run's evidence channel broke (see gate-a-verdict.json's harness_error field). NOT a candidate failure -- re-run this workflow."
            exit 1
          }
          $verdictLabel = '<unknown>'
          if ($verdict) { $verdictLabel = $verdict }
          Write-Error "Gate A dirty lane did not PASS (Run-GateA.ps1 exit code: $code, verdict: $verdictLabel). A candidate that only passes the pristine sandbox is exactly the failure family this lane exists to catch -- see the uploaded gate-a-dirty-verdict / evidence artifacts."
          exit 1

  # ==========================================================================
  # DOWNLOAD-ONLY LANE <gate-a-download-only-lane>. REQUIRED for every
  # release (owner decision 2026-09-02). Same candidate kit, same pinned
  # previous full kit as the dirty lane above, but phase 2 -- the CURRENT
  # candidate's install -- runs from a payload directory this job's
  # Run-GateA.ps1 invocation builds containing ONLY setup.exe and packs\,
  # never station\. Since the K1 fix, the installer's d4-activate-station
  # step has required a station\ folder beside setup.exe and aborted
  # otherwise, so a download-only install/upgrade silently stopped working
  # and no other Gate A lane caught it -- every other lane (including the
  # dirty lane above) installs from the full kit (setup.exe + packs\ +
  # station\). This lane proves the parallel change that makes the installer
  # reuse an already-activated station's cached model packs when station\ is
  # absent, once that change and the accompanying embedded station-index
  # change land.
  #
  # Runs AFTER the dirty lane (needs:), on the same runner -- this box's
  # Windows Sandbox is single-instance and the self-hosted runner's workspace
  # persists across jobs, so strict `needs:` ordering (clean -> dirty ->
  # download-only) is what keeps three jobs from contending for the same
  # sandbox slot and mapped-folder tree the way the clean/dirty pair already
  # does. REQUIRED, not informational -- the `Fail the job on a non-PASS
  # verdict or harness error` step below fails the job like any other CI
  # check; nothing about the promotion-rule/branch-protection gate elsewhere
  # in this repo is touched by that (see docs/ops/gate-a.md, "Promotion
  # rule" -- this job's own required-ness on the workflow itself is an
  # explicit owner decision, not something this file elevates on its own).
  # Timing contract: same two-install-cycle budget as the dirty lane (210
  # in-sandbox watchdog, 230 host poll, 340 job timeout) -- asserted by
  # tests/gate_a/test_gate_a_harness_contract.py.
  # ==========================================================================
  station-acceptance-download-only:
    name: Download-only upgrade lane
    needs: station-acceptance-dirty
    if: ${{ always() && ((github.event_name == 'workflow_dispatch' && (inputs.lane == 'download-only-only' || needs.station-acceptance-dirty.result == 'success')) || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && needs.station-acceptance-dirty.result == 'success')) }}
    runs-on: [self-hosted, windows, sandbox-lab]
    timeout-minutes: 340
    steps:
      - name: Wait for prior run's workspace to be clean
        shell: pwsh
        timeout-minutes: 10
        run: |
          # Same rename-probe drain as the clean/dirty jobs above -- the
          # dirty lane that just finished on this same runner may still be
          # releasing its VSMB handles when this job's Checkout starts.
          if (-not (Test-Path 'sandbox-lab')) {
            Write-Host "No sandbox-lab/ present yet -- nothing to drain, proceeding to Checkout."
            exit 0
          }
          function Test-DirectoryHandlesFree {
              param([string]$Path)
              if (-not (Test-Path -LiteralPath $Path)) { return $true }
              $parent = Split-Path -Parent $Path
              $leaf = Split-Path -Leaf $Path
              $probeLeaf = "$leaf.checkout-drain-probe-$([guid]::NewGuid().ToString('N'))"
              $probePath = Join-Path $parent $probeLeaf
              try {
                  Rename-Item -LiteralPath $Path -NewName $probeLeaf -ErrorAction Stop
              } catch {
                  return $false
              }
              try {
                  Rename-Item -LiteralPath $probePath -NewName $leaf -ErrorAction Stop
                  return $true
              } catch {
                  Start-Sleep -Milliseconds 500
                  try {
                      Rename-Item -LiteralPath $probePath -NewName $leaf -ErrorAction Stop
                  } catch {
                      Write-Warning "Could not rename $probePath back to $leaf -- left renamed for manual recovery: $_"
                  }
                  return $false
              }
          }
          $probeTargets = @('scripts', 'hoststore', 'output', 'soak-4h') |
              ForEach-Object { Join-Path 'sandbox-lab' $_ } |
              Where-Object { Test-Path $_ }
          if (-not $probeTargets) {
            Write-Host "sandbox-lab/ present but none of its mapped subfolders exist -- proceeding to Checkout."
            exit 0
          }
          $deadline = (Get-Date).AddSeconds(300)
          while ($true) {
              $busy = @($probeTargets | Where-Object { -not (Test-DirectoryHandlesFree -Path $_) })
              if ($busy.Count -eq 0) { Write-Host "Workspace is clean."; break }
              Write-Host "$((Get-Date).ToString('o')) waiting on prior run's teardown -- still locked: $($busy -join ', ')"
              if ((Get-Date) -ge $deadline) { Write-Warning "Still locked after 300s -- proceeding to Checkout anyway."; break }
              Start-Sleep -Seconds 5
          }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve target run id and candidate sha
        id: run_id
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $runId = "${{ github.event.inputs.run_id }}"
          if ([string]::IsNullOrWhiteSpace($runId)) {
            $runId = "${{ github.event.workflow_run.id }}"
          }
          if ([string]::IsNullOrWhiteSpace($runId)) {
            throw "Could not resolve a run id from either workflow_dispatch input or workflow_run event."
          }
          "run_id=$runId" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $sha = "${{ github.event.workflow_run.head_sha }}"
          if ([string]::IsNullOrWhiteSpace($sha)) {
            Write-Host "No workflow_run head_sha available (workflow_dispatch trigger) -- resolving via gh run view $runId."
            $runJson = & gh run view $runId -R "scottconverse/civiccast-native" --json headSha 2>&1
            if ($LASTEXITCODE -ne 0) {
              throw "gh run view $runId failed: $runJson"
            }
            $sha = ($runJson | ConvertFrom-Json).headSha
          }
          if ([string]::IsNullOrWhiteSpace($sha)) {
            throw "Could not resolve a candidate sha for run $runId."
          }
          "source_sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "run_id=$runId source_sha=$sha"

      - name: Clean previous kit-staging (21 GB/run -- keep only the current candidate)
        shell: pwsh
        run: |
          $stagingRoot = "sandbox-lab/kit-staging"
          $currentSha = "${{ steps.run_id.outputs.source_sha }}"
          if (Test-Path $stagingRoot) {
            Get-ChildItem -Path $stagingRoot -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -ne $currentSha } |
              ForEach-Object {
                Write-Host "Removing stale kit-staging dir: $($_.FullName)"
                if ($_.LinkType) {
                  $_.Delete()
                } else {
                  Remove-Item -LiteralPath $_.FullName -Recurse -Force -ErrorAction SilentlyContinue
                }
              }
          } else {
            New-Item -ItemType Directory -Force -Path $stagingRoot | Out-Null
          }

      - name: Reuse a locally pre-staged kit when this box already has it
        id: local_kit
        shell: pwsh
        timeout-minutes: 10
        run: |
          $sha = "${{ steps.run_id.outputs.source_sha }}"
          $local = Join-Path "C:\CivicCastTester\kit-staging" $sha
          $target = Join-Path "sandbox-lab/kit-staging" $sha
          if ((Test-Path (Join-Path $local "station")) -and (Get-ChildItem $local -Filter "*setup.exe" -ErrorAction SilentlyContinue)) {
            New-Item -ItemType Directory -Force (Split-Path $target) | Out-Null
            if (Test-Path $target) { Remove-Item -LiteralPath $target -Recurse -Force -ErrorAction SilentlyContinue }
            New-Item -ItemType Junction -Path $target -Target $local | Out-Null
            Write-Host "Reusing locally staged kit: $local"
            "found=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "No locally staged kit at $local -- falling back to artifact download."
            "found=false" >> $env:GITHUB_OUTPUT
          }

      - name: Download the candidate kit artifact (parallel, chunked)
        if: steps.local_kit.outputs.found != 'true'
        uses: actions/download-artifact@v4
        timeout-minutes: 60
        with:
          name: native-beta-kit-${{ steps.run_id.outputs.source_sha }}
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: sandbox-lab/kit-staging/${{ steps.run_id.outputs.source_sha }}

      - name: Resolve and verify immutable previous candidate
        id: upgrade_baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Reuses the SAME pinned previous candidate identity as the dirty
          # lane's own "Resolve and verify immutable previous candidate"
          # step -- one immutable upgrade baseline, two cross-version lanes.
          $baselinePath = "sandbox-lab/upgrade-baseline.json"
          $baseline = Get-Content -LiteralPath $baselinePath -Raw | ConvertFrom-Json
          if ($baseline.schema_version -ne 2) { throw "Unsupported upgrade baseline schema: $($baseline.schema_version)" }
          $previousSha = [string]$baseline.source_sha
          $previousRunId = [string]$baseline.run_id
          $previousInstallerSha256 = [string]$baseline.installer_sha256
          $previousStationIndexSha256 = [string]$baseline.station_index_sha256
          $previousProductVersion = [string]$baseline.product_version
          if ($previousSha -notmatch '^[0-9a-f]{40}$' -or $previousRunId -notmatch '^\d+$') {
            throw "Invalid immutable previous candidate identity in $baselinePath"
          }
          if ($previousInstallerSha256 -notmatch '^[0-9a-f]{64}$' -or $previousStationIndexSha256 -notmatch '^[0-9a-f]{64}$' -or $previousProductVersion -notmatch '^[0-9A-Za-z][0-9A-Za-z.+-]*$') {
            throw "Invalid immutable previous candidate byte/version identity in $baselinePath"
          }
          if ($previousSha -eq "${{ steps.run_id.outputs.source_sha }}") {
            throw "Pinned previous source SHA equals the current candidate; this would be a same-candidate reinstall."
          }
          $runJson = & gh run view $previousRunId -R "scottconverse/civiccast-native" --json headSha,workflowName,conclusion,status 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Could not verify pinned previous candidate run ${previousRunId}: $runJson" }
          $run = $runJson | ConvertFrom-Json
          if ($run.headSha -ne $previousSha -or $run.workflowName -ne 'native-beta-candidate-artifacts' -or $run.conclusion -ne 'success') {
            throw "Pinned previous candidate identity mismatch: expected sha=$previousSha workflow=native-beta-candidate-artifacts conclusion=success; got sha=$($run.headSha) workflow=$($run.workflowName) conclusion=$($run.conclusion)"
          }
          "previous_source_sha=$previousSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "previous_run_id=$previousRunId" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "previous_installer_sha256=$previousInstallerSha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "previous_station_index_sha256=$previousStationIndexSha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "previous_product_version=$previousProductVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Verified previous candidate: label=$($baseline.candidate_label) run_id=$previousRunId source_sha=$previousSha product_version=$previousProductVersion gate_a_run_id=$($baseline.gate_a_run_id)"

      - name: Require the pinned previous full kit from local staging
        shell: pwsh
        run: |
          # Same fail-closed identity check as the dirty lane's own step:
          # the previous candidate's full kit (needed for phase 1, which is
          # unchanged by this lane) must be present locally with exactly the
          # pinned installer/station-index bytes and product version.
          $previousSha = "${{ steps.upgrade_baseline.outputs.previous_source_sha }}"
          $local = Join-Path "C:\CivicCastTester\kit-staging" $previousSha
          $targetRoot = "sandbox-lab/previous-kit-staging"
          $target = Join-Path $targetRoot $previousSha
          $installers = @(Get-ChildItem -LiteralPath $local -Filter "*setup.exe" -File -ErrorAction SilentlyContinue)
          $stationIndexPath = Join-Path $local "station\station-index.json"
          if (-not (Test-Path $stationIndexPath) -or $installers.Count -ne 1) {
            throw "Previous full kit is absent or incomplete at $local; refusing to substitute a different candidate or partial artifact."
          }
          $installer = $installers[0]
          $installerHash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $stationIndexHash = (Get-FileHash -LiteralPath $stationIndexPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $installerVersion = ([System.Diagnostics.FileVersionInfo]::GetVersionInfo($installer.FullName).ProductVersion).Trim()
          $stationIndex = Get-Content -LiteralPath $stationIndexPath -Raw | ConvertFrom-Json
          $stationVersion = [string]$stationIndex.manifest.product_version
          $expectedInstallerHash = "${{ steps.upgrade_baseline.outputs.previous_installer_sha256 }}"
          $expectedStationIndexHash = "${{ steps.upgrade_baseline.outputs.previous_station_index_sha256 }}"
          $expectedVersion = "${{ steps.upgrade_baseline.outputs.previous_product_version }}"
          if ($installerHash -ne $expectedInstallerHash -or $stationIndexHash -ne $expectedStationIndexHash -or $installerVersion -ne $expectedVersion -or $stationVersion -ne $expectedVersion) {
            throw "Previous local kit identity mismatch: installer_sha256=$installerHash (expected $expectedInstallerHash), station_index_sha256=$stationIndexHash (expected $expectedStationIndexHash), installer_version=$installerVersion station_version=$stationVersion (expected $expectedVersion)."
          }
          New-Item -ItemType Directory -Force -Path $targetRoot | Out-Null
          if (Test-Path $target) {
            $item = Get-Item -LiteralPath $target -Force
            if ($item.LinkType) { $item.Delete() } else { Remove-Item -LiteralPath $target -Recurse -Force }
          }
          New-Item -ItemType Junction -Path $target -Target $local | Out-Null
          Write-Host "Pinned byte-verified previous full kit: $target -> $local (installer_sha256=$installerHash station_index_sha256=$stationIndexHash product_version=$expectedVersion)"

      - name: Record the candidate's migration head (build time)
        id: expected_head
        shell: pwsh
        run: |
          # <gate-a-audit-BL-10> The judge's post-upgrade schema proof needs
          # an expected-head string whose origin is NOT the station under
          # test. PR #143's guard compared /health's schema_db_revision to
          # /health's schema_expected_head -- both from one SchemaStatus in
          # one process, and schema=="current" is DEFINED as those two being
          # equal -- so it was 1 whenever the station-up check passed and
          # could never fail. This step derives the head here, on the runner,
          # from the candidate's own migration files with a standard-library
          # parser (scripts/gate_a_expected_head.py -- no alembic, no
          # civiccast import, no database), and hands it to the gate as an
          # input. The other side of the comparison is the database's own
          # alembic_version row, read in the sandbox with psql.
          $head = & python scripts/gate_a_expected_head.py
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($head)) {
            Write-Error "Could not derive the candidate's migration head (exit $LASTEXITCODE). Gate A's post-upgrade schema proof requires it; refusing to run the lane with no independent expected head."
            exit 1
          }
          $head = $head.Trim()
          Write-Host "Candidate migration head (build time): $head"
          "head=$head" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Run Gate A (download-only lane)
        id: gate_a_download_only
        shell: pwsh
        run: |
          # Same timing contract as the dirty lane: -DownloadOnlyLane
          # implies the in-sandbox watchdog raising itself to 210 minutes
          # (DIRTY_MODE.txt is written either way), so -TimeoutMinutes here
          # MUST stay above 210 -- asserted by tests/gate_a/
          # test_gate_a_harness_contract.py. Run-GateA.ps1 builds the
          # filtered current-candidate payload (setup.exe + packs\, no
          # station\) itself before launching Sandbox.
          pwsh -File sandbox-lab/Run-GateA.ps1 -KitDir "sandbox-lab/kit-staging/${{ steps.run_id.outputs.source_sha }}" -SourceSha "${{ steps.run_id.outputs.source_sha }}" -RunId ${{ steps.run_id.outputs.run_id }} -DownloadOnlyLane -PreviousKitDir "sandbox-lab/previous-kit-staging/${{ steps.upgrade_baseline.outputs.previous_source_sha }}" -PreviousSourceSha "${{ steps.upgrade_baseline.outputs.previous_source_sha }}" -SoakMinutes 10 -TimeoutMinutes 230 -ExpectedMigrationHead "${{ steps.expected_head.outputs.head }}"
          $exitCode = $LASTEXITCODE
          "exit_code=$exitCode" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $latest = Get-ChildItem -Path "sandbox-lab/evidence" -Directory -Recurse -ErrorAction SilentlyContinue |
            Where-Object { Test-Path (Join-Path $_.FullName "gate-a-verdict.json") } |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($latest) {
            "evidence_dir=$($latest.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          exit $exitCode

      - name: Publish the download-only-lane verdict to the run summary
        if: always()
        shell: pwsh
        run: |
          # This lane is REQUIRED (owner decision 2026-09-02), so its verdict
          # belongs on the run's front page just as loudly as the dirty
          # lane's informational one does.
          $evidenceDir = "${{ steps.gate_a_download_only.outputs.evidence_dir }}"
          $lines = @("## Gate A download-only lane (setup.exe + packs\, no station\)", "")
          $verdictPath = if ($evidenceDir) { Join-Path $evidenceDir 'gate-a-verdict.json' } else { $null }
          if ($verdictPath -and (Test-Path $verdictPath)) {
            try {
              $v = Get-Content -Path $verdictPath -Raw | ConvertFrom-Json
              $lines += "**Verdict: $($v.verdict)** (lane: $($v.lane))"
              $lines += ""
              $lines += "| check | status | detail |"
              $lines += "| --- | --- | --- |"
              foreach ($prop in $v.checks.PSObject.Properties) {
                $detail = ($prop.Value.detail -replace '\|', '\|')
                $lines += "| $($prop.Name) | $($prop.Value.status) | $detail |"
              }
            } catch {
              $lines += "Could not parse gate-a-verdict.json: $_"
            }
          } else {
            $lines += "No gate-a-verdict.json was produced (exit code: ${{ steps.gate_a_download_only.outputs.exit_code }})."
          }
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload download-only-lane verdict
        if: always() && steps.gate_a_download_only.outputs.evidence_dir != ''
        uses: actions/upload-artifact@v4
        timeout-minutes: 30
        with:
          name: gate-a-download-only-verdict-${{ steps.run_id.outputs.run_id }}
          path: ${{ steps.gate_a_download_only.outputs.evidence_dir }}/gate-a-verdict.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload download-only-lane evidence
        if: always() && steps.gate_a_download_only.outputs.evidence_dir != ''
        uses: actions/upload-artifact@v4
        timeout-minutes: 30
        with:
          name: gate-a-download-only-${{ steps.run_id.outputs.run_id }}
          path: ${{ steps.gate_a_download_only.outputs.evidence_dir }}
          if-no-files-found: warn
          retention-days: 14

      - name: Unlink the pinned previous-kit junction (never leave it for the next checkout)
        if: always()
        shell: pwsh
        run: |
          # Same reason as the dirty lane's own step: left behind, the next
          # run's actions/checkout `git clean -ffdx` walks through this
          # junction and deletes the real pinned kit. Remove ONLY the link.
          $root = "sandbox-lab/previous-kit-staging"
          if (Test-Path $root) {
            Get-ChildItem -LiteralPath $root -Force -ErrorAction SilentlyContinue | ForEach-Object {
              if ($_.LinkType) {
                Write-Host "Unlinking previous-kit junction: $($_.FullName) -> $($_.Target)"
                $_.Delete()
              } else {
                Write-Warning "Not a junction, leaving in place for inspection: $($_.FullName)"
              }
            }
          }

      - name: Unlink download-only payload junctions (never leave one for the next checkout)
        if: always()
        shell: pwsh
        run: |
          # <gate-a-download-only-lane-review> BLOCKER 1: belt-and-suspenders
          # on top of Run-GateA.ps1's own try/finally (Restore-DownloadOnly-
          # KitDownload / Remove-DownloadOnlyPayload), which already runs on
          # every exit path of that script -- this step covers the case
          # where the RUNNER ITSELF died between steps (job cancellation,
          # runner crash, `timeout-minutes` kill) before Run-GateA.ps1's own
          # finally could run. Same failure mode as the previous-kit
          # junction above: a junction left under sandbox-lab\ survives to
          # the next job's Checkout, whose `git clean -ffdx` walks through
          # it and deletes the real target it points at.
          #
          # kit-download itself is never simply deleted here -- if it is
          # still a junction pointing at the filtered payload (i.e.
          # Run-GateA.ps1's own restore never ran), repoint it back to the
          # real current kit under kit-staging\<sha>\ so a re-run of this
          # step, or a human inspecting the workspace, finds the ordinary
          # kit-download contract restored, not a dangling link.
          $sha = "${{ steps.run_id.outputs.source_sha }}"
          $realKit = if ($sha) { Join-Path "sandbox-lab/kit-staging" $sha } else { $null }

          $kitDownload = "sandbox-lab/kit-download"
          if (Test-Path $kitDownload) {
            $item = Get-Item -LiteralPath $kitDownload -Force -ErrorAction SilentlyContinue
            if ($item -and $item.LinkType) {
              $target = @($item.Target) | Select-Object -First 1
              if ($target -and $target -match '\\kit-download-filtered$') {
                Write-Host "kit-download still points at the filtered payload ($target) -- Run-GateA.ps1's own cleanup did not run. Restoring."
                $item.Delete()
                if ($realKit -and (Test-Path $realKit)) {
                  $realKitPhysical = (Resolve-Path $realKit).Path
                  New-Item -ItemType Junction -Path $kitDownload -Target $realKitPhysical | Out-Null
                  Write-Host "Restored kit-download -> $realKitPhysical"
                } else {
                  Write-Warning "Could not resolve the real current kit at '$realKit' to restore kit-download -- left unlinked rather than pointed at a possibly-stale target."
                }
              } else {
                Write-Host "kit-download is a junction pointing at '$target' (not the filtered payload) -- left as-is."
              }
            }
          }

          $filteredPayload = "sandbox-lab/kit-download-filtered"
          if (Test-Path $filteredPayload) {
            Write-Host "Removing leftover filtered payload directory: $filteredPayload"
            # Safe: New-DownloadOnlyPayload builds this tree from hard links
            # and real directories only -- never a reparse point at any
            # level -- so a plain recursive delete cannot walk through a
            # junction and reach anything outside this tree.
            Remove-Item -LiteralPath $filteredPayload -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Fail the job on a non-PASS verdict or harness error
        if: always()
        shell: pwsh
        run: |
          # Same BUSY / HARNESS_ERROR discrimination as the clean/dirty jobs
          # above -- neither is a station-acceptance finding, and neither may
          # read as a download-only-lane product failure. Unlike the dirty
          # lane, this job's failure IS meant to gate the release (owner
          # decision 2026-09-02) -- but a harness-busy or harness-error
          # outcome still isn't a product finding, so it still fails the job
          # with a distinctly worded, re-runnable message rather than the
          # generic one.
          $code = "${{ steps.gate_a_download_only.outputs.exit_code }}"
          if ($code -eq '0') {
            Write-Host "Gate A download-only lane PASS."
            exit 0
          }
          $verdict = $null
          $evidenceDir = "${{ steps.gate_a_download_only.outputs.evidence_dir }}"
          if ($evidenceDir -and (Test-Path (Join-Path $evidenceDir 'gate-a-verdict.json'))) {
            try {
              $verdict = (Get-Content -Path (Join-Path $evidenceDir 'gate-a-verdict.json') -Raw | ConvertFrom-Json).verdict
            } catch {
              Write-Warning "Could not parse gate-a-verdict.json to determine verdict: $_"
            }
          }
          if ($verdict -eq 'BUSY') {
            Write-Error "Gate A download-only lane did not run: Windows Sandbox was busy for the entire wait window. NOT a product failure -- re-run this workflow once the sandbox is free."
            exit 1
          }
          if ($verdict -eq 'HARNESS_ERROR') {
            Write-Error "Gate A download-only lane produced no station-acceptance verdict: the run's evidence channel broke (see gate-a-verdict.json's harness_error field). NOT a candidate failure -- re-run this workflow."
            exit 1
          }
          $verdictLabel = '<unknown>'
          if ($verdict) { $verdictLabel = $verdict }
          Write-Error "Gate A download-only lane did not PASS (Run-GateA.ps1 exit code: $code, verdict: $verdictLabel). A candidate that only installs from the full kit is exactly the failure family this REQUIRED lane exists to catch -- see the uploaded gate-a-download-only-verdict / evidence artifacts."
          exit 1
