# SPDX-License-Identifier: Apache-2.0
# Security scanning gate (audit item #27). Non-required: catches drift
# between merges rather than blocking every PR on a scanner false-positive
# before triage tooling exists. Runs pip-audit (Python deps), bandit -ll
# (service code static analysis), and npm audit --audit-level=high (both
# portals). Known, triaged findings with no available fix are pinned in
# security/pip-audit-allowlist.json with a dated reason; everything else
# must be zero.

name: ci-security-scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly drift catcher — a dependency can grow a new CVE between merges
    # even with no code change here.
    - cron: "30 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (Python dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project (dev)
        run: uv sync --all-extras --group dev

      - name: pip-audit (fail on any un-allowlisted vulnerability)
        run: |
          uv run pip-audit --format json > pip-audit-report.json || true
          python scripts/check_pip_audit_allowlist.py pip-audit-report.json

  bandit:
    name: bandit (service code static analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project (dev)
        run: uv sync --all-extras --group dev

      - name: bandit -ll
        run: uv run bandit -ll -r civiccast -x "*/apps/*/node_modules/*"

  npm-audit-operator:
    name: npm audit (operator console)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: civiccast/apps/portal-operator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "20"

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: npm audit --audit-level=high
        run: npm audit --audit-level=high

  npm-audit-public:
    name: npm audit (public portal)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: civiccast/apps/portal-public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "20"

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: npm audit --audit-level=high
        run: npm audit --audit-level=high
