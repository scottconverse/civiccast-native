# SPDX-License-Identifier: Apache-2.0
name: ci-installer-compile

# PR-time compile guard for the Tauri installer's Rust crate (#204).
# workflow-cost: windows-pr-justification -- the installer ships only on Windows.
#
# The installer is only *built* in release-artifacts.yml's `windows-installer`
# job, which is tag/manual-only — so a PR that breaks the installer's Rust
# compile is not caught until a release tag. The installer's other PR-time tests
# (tests/policy/test_windows_wsl_bootstrap_script.py) only string-match the
# bootstrap script; they never compile the app. This guard closes that gap: it
# `cargo test`s the crate on the release OS (Windows) whenever installer code
# changes, so both a compile break AND a regression in the installer's pure
# decision logic (the #[cfg(test)] unit tests in main.rs — WSL classifiers,
# health-response parsing, URL/PowerShell-quote validation) surface on the PR
# that introduces it.
#
# `cargo test --locked` compiles the crate and runs its unit tests: it fails on a
# stale Cargo.lock, and (verified locally, tauri 2 / cargo 1.96) it does NOT need
# the frontend `dist` to exist — tauri-build only requires `frontendDist` for a
# real bundle, not for a test build — so no Node/npm step is needed. Path-filtered,
# so it only runs when the installer actually changes.
#
# The Pester suite that used to run here (tests/policy/HeadlessBootstrap.Tests.ps1)
# is gone with headless-bootstrap.ps1 itself -- the WSL2 install lane, removed
# under the owner's "no linux" decision. It dot-sourced that script and
# exercised its functions, so it had nothing left to test.

on:
  pull_request:
    branches: [main]
    paths:
      - "civiccast/apps/installer/**"
      - ".github/workflows/ci-installer-compile.yml"
  workflow_call:
    inputs:
      native_beta_windows_only:
        description: Run the native-beta frontend contract on Windows without browser E2E.
        default: false
        required: false
        type: boolean
      source_sha:
        description: Exact source commit to validate when called by another workflow.
        required: false
        type: string

concurrency:
  group: ci-installer-compile-reusable-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  installer-compile:
    name: Installer Rust compile + unit tests (Windows)
    # Windows is the installer's only ship target (Tauri MSI/NSIS), so the
    # release OS is where a compile break actually matters. Hosted runner per
    # Scott's 2026-06-12 directive (scripts/policy/check_workflow_runners.py).
    runs-on: windows-latest
    timeout-minutes: 60
    if: |
      github.event_name == 'workflow_call' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: civiccast/apps/installer/src-tauri

      - name: cargo test (compile guard + unit tests)
        working-directory: civiccast/apps/installer/src-tauri
        run: cargo test --locked

  # NF-1: the installer's React state machine (keyboard-activation guard, the
  # optimistic-banner/stale-error reconciliation, the native-read-authoritative
  # progress logic) had NO CI gate — ci-installer-compile only covered the Rust
  # crate, so a PR could silently reintroduce the G-5/G-9/T-3 first-run bugs.
  # This job runs the frontend vitest units + the Playwright e2e suite (which
  # mocks the Tauri invoke bridge, so no Tauri binary is needed).
  installer-frontend:
    name: Installer frontend validation
    runs-on: ${{ inputs.native_beta_windows_only && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 30
    if: |
      github.event_name == 'workflow_call' ||
      github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: civiccast/apps/installer
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node 20
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: civiccast/apps/installer/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Runs on EVERY PR, not just the native-beta build below. `vite build`
      # transpiles with esbuild, which strips types without checking them, and
      # this app had no tsconfig.json at all -- so nothing in CI had ever
      # type-checked the installer frontend. Its first run found a crash path
      # in the downloading screen (see components-catalog.ts's
      # catalogComponentForWireId).
      - name: Type check
        timeout-minutes: 10
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm run test:unit

      - name: Production build (native beta Windows)
        if: inputs.native_beta_windows_only
        run: npm run build

      - name: Install Playwright browser
        if: inputs.native_beta_windows_only != true
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (Playwright, mocked Tauri bridge)
        if: inputs.native_beta_windows_only != true
        run: npm run test:e2e
