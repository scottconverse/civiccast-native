# SPDX-License-Identifier: Apache-2.0
# Documentation render check. Verifies the user manual (and other prose docs)
# render cleanly to PDF and DOCX via Pandoc, including the real render tests.

name: ci-docs

on:
  pull_request:
    branches: [main, 'program/**', 'release/**']
    paths:
      - ".github/workflows/ci-docs.yml"
      - "docs/**"
      - "scripts/render-user-manual.sh"
      - "scripts/render_user_manual.py"
      - "tests/test_user_manual_render.py"
      - "scripts/generate-openapi-artifacts.py"
      - "civiccast/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pandoc-render:
    name: Pandoc PDF/DOCX render
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project (dev)
        run: uv sync --all-extras --group dev

      - name: Install pandoc and TeX (per ADR 0005)
        # Reuse this job's real Pandoc/TeX environment for render regressions.
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            pandoc \
            lmodern \
            texlive-xetex \
            texlive-fonts-recommended \
            texlive-latex-recommended \
            texlive-latex-extra

      - name: Run real manual render regressions (no skips)
        timeout-minutes: 10
        shell: bash
        run: |
          uv run python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          import pytest
          nodes = """
          tests/test_user_manual_render.py::TestUserManualRenderContent::test_renders_to_docx_without_error
          tests/test_user_manual_render.py::TestUserManualRenderContent::test_plaintext_render_contains_required_headings
          tests/test_user_manual_render.py::TestUserManualRenderContent::test_docx_artifact_contains_document_payload
          tests/test_user_manual_render.py::TestUserManualVersionHeaderConsistency::test_fresh_render_running_header_matches_source_and_passes_check_current
          """.strip().splitlines()
          code = pytest.main([*nodes, "-q", "-ra", "--no-cov", "--junitxml=junit-manual-render.xml"])
          if code:
              sys.exit(code)
          cases = list(ET.parse("junit-manual-render.xml").iter("testcase"))
          assert len(cases) >= len(nodes), "Selected cases did not all execute"
          assert all(not any(c.find(tag) is not None for tag in ("skipped", "failure", "error")) for c in cases), "Selected coverage was skipped or failed"
          print(f"Required coverage executed: {len(cases)} passed, no skips")
          PY

      - name: Render USER-MANUAL via scripts/render-user-manual.sh
        run: |
          chmod +x scripts/render-user-manual.sh
          OUT_DIR=$PWD/artifacts/release-preparation/manual ./scripts/render-user-manual.sh
          uv run python scripts/render_user_manual.py --out-dir artifacts/release-preparation/manual --check-current

      - name: Check tracked in-product manual artifact (civiccast/docsite)
        run: uv run python scripts/render_docsite_manual.py --check-current

      - name: Check generated API artifacts
        run: uv run python scripts/generate-openapi-artifacts.py --check

      - name: Upload rendered manual
        uses: actions/upload-artifact@v7.0.1
        timeout-minutes: 10
        with:
          name: user-manual
          path: |
            artifacts/release-preparation/manual/USER-MANUAL.*
            junit-manual-render.xml
          if-no-files-found: error
          retention-days: 1

      - name: Docs tree readable
        run: |
          find docs -name "*.md" -exec head -c 1 {} \; > /dev/null
          echo "Docs tree readable."
