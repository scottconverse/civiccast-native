# SPDX-License-Identifier: Apache-2.0
#
# deterministic-detector harness (installed by /deterministic-detector:install-detector,
# adapted to this repo's uv + testcontainers setup — mirrors ci-test.yml).
#
# ---------------------------------------------------------------------------
# ENFORCEMENT STATUS — READ BEFORE TOUCHING BRANCH PROTECTION
#
# randomized-suite: starts INFORMATIONAL. It is flipped to a REQUIRED status
#   check ONLY by the repo owner, and ONLY after burn-in (five green runs
#   across different seeds, or one deliberate pollution-hunt pass). This
#   suite has never run in random order in CI; a day-one required check would
#   hold an unrelated PR hostage for latent order-dependence this job exists
#   to find.
#
# Mutation testing is not a CI or release requirement. Its automatic job was
# removed by owner instruction on 2026-10-22.
#
# Agents NEVER create, modify, or remove required-status-check / branch
# protection settings, in either direction. That flip is owner-performed.
# ---------------------------------------------------------------------------

name: deterministic-detectors

on:
  pull_request:
    branches: [main, 'program/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  randomized-suite:
    # Status-check context = this name; keep it plain so branch protection
    # can reference "randomized-suite" exactly once the owner promotes it.
    name: randomized-suite
    runs-on: ubuntu-latest
    timeout-minutes: 75
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      CIVICCAST_RUN_POSTGRES_TESTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install media test prerequisites
        # Shared with ci-test.yml's "Unit tests" job -- see
        # scripts/ci/install_media_test_prerequisites.sh for the full
        # rationale (dpkg-lock wait + slow-mirror handling, both confirmed
        # hosted-runner failure modes with real job-ID evidence in the
        # script's header comment, including this job's own 2026-09-02
        # failures). timeout-minutes raised from 10: the script's own
        # internal per-apt-call timeouts (8 min each, up to 3 calls) need
        # headroom to actually run to completion on a slow mirror rather
        # than being killed by the step wrapper first.
        timeout-minutes: 30
        run: bash scripts/ci/install_media_test_prerequisites.sh

      - name: Install project (dev)
        # --no-extra agenda-js-import: mirrors ci-test.yml's own "Install
        # project (dev)" step and its comment there -- crawl4ai's package
        # being importable without Playwright's Chromium binary staged
        # (this job never runs `playwright install chromium`) is worse than
        # not installing it at all for civiccast.agenda_import.js_portal's
        # tests, which are hermetic regardless via monkeypatch/sys.modules.
        run: uv sync --all-extras --no-extra agenda-js-import --group dev

      - name: Probe Docker (testcontainers prerequisite)
        run: |
          if ! [ -S /var/run/docker.sock ] && [ -z "${DOCKER_HOST:-}" ]; then
            echo "::error::Docker socket not present; testcontainers cannot spin up Postgres."
            exit 1
          fi
          docker version >/dev/null

      - name: Run platform-appropriate suites under pytest-randomly (informational)
        run: |
          # No -q: pytest-randomly prints "Using --randomly-seed=N" in the header,
          # which -q would suppress. Capture the seed to the summary + a log artifact
          # BEFORE exiting, so a FAILED randomized run is replayable (the whole point
          # of this lane). -p randomly re-enables the plugin that addopts disables by
          # default, so this randomization is isolated to this informational job.
          set +e
          # Match ci-test's platform split: the full cross-platform suite
          # excludes tests/native, while its platform-independent native
          # portion is selected explicitly.  Windows-only tests run in the
          # Windows job and must not be treated as Ubuntu failures here.
          uv run pytest -p randomly --no-cov --ignore=tests/native | tee pytest-random.log
          status=${PIPESTATUS[0]}
          seed=$(grep -o 'Using --randomly-seed=[0-9]*' pytest-random.log | head -1 || true)
          if [ "$status" -eq 0 ] && [ -n "$seed" ]; then
            uv run pytest tests/native -m "not windows_only" -p randomly --no-cov \
              "--${seed#Using --}" | tee -a pytest-random.log
            status=${PIPESTATUS[0]}
          fi
          {
            echo "### Randomized suite seed"
            echo "${seed:-(seed not found)}"
            echo ""
            echo "Replay cross-platform: \`uv run pytest -p randomly --ignore=tests/native --${seed#Using --}\`"
            echo "Replay native-pure: \`uv run pytest tests/native -m 'not windows_only' -p randomly --no-cov --${seed#Using --}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload randomized-suite log (seed + failures for replay)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        timeout-minutes: 10
        with:
          name: randomized-suite-log
          path: pytest-random.log
          if-no-files-found: warn
          retention-days: 1
