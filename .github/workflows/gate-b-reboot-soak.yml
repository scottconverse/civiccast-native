#
# Gate B -- the 24-hour unattended REBOOT soak.
#
# WHAT THIS PROVES: a clean install of a native-beta candidate kit inside a
# persistent Hyper-V VM, K1 activation, all three PEG channels
# (public/education/government) broadcasting concurrently through the product
# GStreamer egress engine, health sampled every five minutes for 24 hours, a
# REBOOT at the halfway mark that the station survives UNATTENDED and comes
# back from to broadcasting, zero unplanned service or child restarts either
# side of it, and TSDuck transport-stream verification before and after --
# judged by code (scripts/gate_b_verdict.py), fail-closed, from files a
# harness wrote, never from prose. See docs/ops/gate-b.md for the full
# verdict-criteria table with spec citations.
#
# WHY IT IS A SEPARATE GATE FROM GATE A: Windows Sandbox, which Gate A runs
# in, structurally CANNOT reboot -- it is a disposable VM that is destroyed
# rather than restarted. The 3.0 MASTER spec §12 release-readiness gate is
# explicit that a reboot is required ("24h unattended soak w/
# kill+restart+reboot"), and its station-acceptance list requires the box to
# "survive an unattended reboot". Gate A's own documentation names that scope
# as out of bounds for it and assigns it here.
#
# WHAT THIS DOES NOT PROVE: physical SDI proof (rung 3 -- no DeckLink
# pass-through into the VM), the 72h candidate soak (§12 names it separately;
# Gate B is the 24h rung), the commissioning-wizard UI walkthrough, OTT-app
# presence, and the support-bundle export. Those remain the existing
# manual/Playwright acceptance work and a future Gate C.
#
# STATUS: NOT YET RUN. As of this workflow's commit, Gate B has never
# executed against any candidate: Hyper-V is not enabled on the sandbox-lab
# runner box (gate-b/Test-GateBPrereqs.ps1 reports
# Microsoft-Hyper-V-All:Disabled), and enabling it is a one-time elevated,
# reboot-requiring, OWNER-ONLY machine change that no agent performs. Until
# that happens every dispatch of this workflow will exit 2 with a
# HYPERV_UNAVAILABLE verdict -- explicitly NOT a product FAIL. The workflow is
# informational only and does not block merges or releases; promoting it to a
# required check is an owner action per this repo's CLAUDE.md "Owner gates".
#
# MANUAL DISPATCH ONLY, ON PURPOSE. Gate A runs automatically after every
# candidate build. Gate B occupies the one physical box for over a day and
# needs an operator to have supplied a base VHDX and a guest credential
# beforehand, so it is never triggered by a build. See docs/ops/gate-b.md,
# "What the operator must supply".

name: gate-b-reboot-soak

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Workflow run id of the native-beta-candidate-artifacts run to judge (leave blank when using kit_dir)"
        required: false
        type: string
      kit_dir:
        description: "Path on the runner to an already-extracted candidate kit (setup.exe + packs\\ + station\\). Skips the artifact download."
        required: false
        type: string
      base_vhdx:
        description: "Path on the runner to the prepared Windows base VHDX the soak VM is cloned from"
        required: true
        type: string
        default: 'C:\CivicCastGateB\base\windows11-oobe-complete.vhdx'
      guest_credential_path:
        description: "Path on the runner to the guest admin credential created with: Get-Credential | Export-CliXml <path>"
        required: true
        type: string
        default: 'C:\CivicCastGateB\guest-cred.xml'
      soak_minutes:
        description: "Soak length. 1440 is the spec §12 floor; anything shorter is a REHEARSAL and the judge will report FAIL on its plan check, by design."
        required: false
        type: string
        default: "1440"

concurrency:
  # The same group Gate A and the self-hosted candidate build use, because
  # all three contend for the ONE physical box. cancel-in-progress is false
  # for a much sharper reason here than for Gate A: cancelling a Gate B run
  # mid-soak discards up to a full day of unrepeatable elapsed time, and there
  # is no way to resume a soak from the middle.
  group: sandbox-lab
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  reboot-soak:
    name: Hyper-V 24h reboot soak + verdict
    runs-on: [self-hosted, windows, sandbox-lab]
    # 1560 minutes = 26 hours: the 24h soak, plus the install and station
    # bring-up before its clock starts, plus the reboot, plus the final
    # evidence pull and judging. It must exceed Run-GateB.ps1's own
    # -HostDeadlineMinutes, which must in turn exceed -SoakMinutes;
    # tests/gate_b/test_gate_b_harness_contract.py asserts that ordering
    # across all three files so it cannot drift.
    timeout-minutes: 1560
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report Hyper-V prerequisites before doing anything expensive
        id: prereqs
        shell: pwsh
        run: |
          # Deliberately does NOT fail the job here. If Hyper-V is off, the
          # run below produces a HYPERV-UNAVAILABLE.txt marker and a
          # HYPERV_UNAVAILABLE verdict document, which is a more useful
          # artifact than a job that died at step 2 with a red X and no
          # evidence directory.
          pwsh -File gate-b/Test-GateBPrereqs.ps1
          "prereq_exit=$LASTEXITCODE" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          exit 0

      - name: Resolve the candidate kit
        id: kit
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $kitDir = "${{ github.event.inputs.kit_dir }}"
          $runId = "${{ github.event.inputs.run_id }}"
          $sha = "unknown-local"

          if (-not [string]::IsNullOrWhiteSpace($kitDir)) {
            if (-not (Test-Path -LiteralPath $kitDir)) { throw "kit_dir '$kitDir' does not exist on this runner." }
            # Recover the sha from the kit-staging\<sha>\ convention Gate A
            # already uses, so the verdict document carries it even on the
            # local-kit path.
            $leaf = Split-Path $kitDir -Leaf
            if ($leaf -match '^[0-9a-f]{7,40}$') { $sha = $leaf }
          } elseif (-not [string]::IsNullOrWhiteSpace($runId)) {
            $runJson = & gh run view $runId -R "scottconverse/civiccast-native" --json headSha 2>&1
            if ($LASTEXITCODE -ne 0) { throw "gh run view $runId failed: $runJson" }
            $sha = ($runJson | ConvertFrom-Json).headSha
            # Prefer a kit this box already has -- the same local-first
            # contract gate-a-station-acceptance.yml consumes. A ~21 GB
            # download measured at ~1 GB per 8 minutes on this runner is ~3h,
            # which is three hours of the soak window spent not soaking.
            $local = Join-Path "C:\CivicCastTester\kit-staging" $sha
            if ((Test-Path (Join-Path $local "station")) -and (Get-ChildItem $local -Filter "*setup.exe" -ErrorAction SilentlyContinue)) {
              $kitDir = $local
              Write-Host "Reusing locally staged kit: $local"
            } else {
              $kitDir = "gate-b/kit-staging/$sha"
              Write-Host "No locally staged kit at $local -- the download step will fetch it."
            }
          } else {
            throw "Supply either kit_dir or run_id."
          }

          "kit_dir=$kitDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "source_sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "needs_download=$([string](-not (Test-Path -LiteralPath $kitDir)))" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Download the candidate kit artifact (parallel, chunked)
        if: steps.kit.outputs.needs_download == 'True'
        uses: actions/download-artifact@v4
        timeout-minutes: 90
        with:
          name: native-beta-kit-${{ steps.kit.outputs.source_sha }}
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: gate-b/kit-staging/${{ steps.kit.outputs.source_sha }}

      - name: Run Gate B
        id: gate_b
        shell: pwsh
        run: |
          pwsh -File gate-b/Run-GateB.ps1 `
            -KitDir "${{ steps.kit.outputs.kit_dir }}" `
            -BaseVhdx "${{ github.event.inputs.base_vhdx }}" `
            -GuestCredentialPath "${{ github.event.inputs.guest_credential_path }}" `
            -SourceSha "${{ steps.kit.outputs.source_sha }}" `
            -RunId "${{ github.run_id }}" `
            -SoakMinutes ${{ github.event.inputs.soak_minutes }}
          $exitCode = $LASTEXITCODE
          "exit_code=$exitCode" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $latest = Get-ChildItem -Path "gate-b/evidence" -Directory -Recurse -ErrorAction SilentlyContinue |
            Where-Object { Test-Path (Join-Path $_.FullName "gate-b-verdict.json") } |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($latest) {
            "evidence_dir=$($latest.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          exit $exitCode

      - name: Upload verdict
        if: always() && steps.gate_b.outputs.evidence_dir != ''
        uses: actions/upload-artifact@v4
        timeout-minutes: 30
        with:
          name: gate-b-verdict-${{ github.run_id }}
          path: ${{ steps.gate_b.outputs.evidence_dir }}/gate-b-verdict.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload evidence
        if: always() && steps.gate_b.outputs.evidence_dir != ''
        uses: actions/upload-artifact@v4
        timeout-minutes: 60
        with:
          name: gate-b-${{ github.run_id }}
          path: ${{ steps.gate_b.outputs.evidence_dir }}
          if-no-files-found: warn
          retention-days: 30

      - name: Fail the job on a non-PASS verdict, distinguishing the non-verdicts
        if: always()
        shell: pwsh
        run: |
          $code = "${{ steps.gate_b.outputs.exit_code }}"
          if ($code -eq '0') {
            Write-Host "Gate B PASS."
            exit 0
          }

          $verdict = $null
          $evidenceDir = "${{ steps.gate_b.outputs.evidence_dir }}"
          if ($evidenceDir -and (Test-Path (Join-Path $evidenceDir 'gate-b-verdict.json'))) {
            try {
              $verdict = (Get-Content -Path (Join-Path $evidenceDir 'gate-b-verdict.json') -Raw | ConvertFrom-Json).verdict
            } catch {
              Write-Warning "Could not parse gate-b-verdict.json to determine verdict: $_"
            }
          }

          # The peer of Gate A's BUSY: the gate never ran, so it observed
          # nothing about the candidate. Reporting this as a product failure
          # would be the authored-truth mistake these gates exist to
          # eliminate, pointed the other way.
          if ($verdict -eq 'HYPERV_UNAVAILABLE') {
            Write-Error "Gate B did not run: Hyper-V is not enabled on this runner, so no rebootable VM could be created. This is NOT a product failure. HYPERV-UNAVAILABLE.txt in the uploaded evidence names the ONE elevated command that fixes it (Enable-WindowsOptionalFeature -Online -FeatureName Microsoft-Hyper-V-All -All -NoRestart, then reboot the box). That is an owner action; no agent enables a hypervisor or reboots this machine."
            exit 1
          }

          if ($verdict -eq 'HARNESS_ERROR') {
            Write-Error "Gate B produced no reboot-soak verdict: the run started and then lost its VM or its evidence channel. This is NOT a candidate failure -- re-run this workflow. See gate-b-verdict.json's harness_error field and the GATE-B-HOST-ERROR.txt / VM-LOST.txt marker in the uploaded evidence."
            exit 1
          }

          # A rehearsal run is a real FAIL with a specific, non-alarming
          # cause, and saying so beats letting an operator hunt for a
          # regression that is not there.
          if ($verdict -eq 'FAIL' -and "${{ github.event.inputs.soak_minutes }}" -ne '1440') {
            Write-Error "Gate B FAILED, and soak_minutes was ${{ github.event.inputs.soak_minutes }}, not 1440. If gate-b-verdict.json's `plan` check is the only FAIL, this was a REHEARSAL and the judge is correctly refusing to grade it as a 24h soak. Check the other checks before reading this as a regression."
            exit 1
          }

          $verdictLabel = '<unknown>'
          if ($verdict) { $verdictLabel = $verdict }
          Write-Error "Gate B did not PASS (Run-GateB.ps1 exit code: $code, verdict: $verdictLabel). See the uploaded gate-b-verdict / evidence artifacts."
          exit 1
