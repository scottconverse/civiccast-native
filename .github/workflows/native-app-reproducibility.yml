name: Native Windows app-payload reproducibility

on:
  pull_request:
    branches: [main, 'program/**']
    paths:
      - ".github/workflows/native-app-reproducibility.yml"
      - "native-windows-build-toolchain.lock.json"
      - "native-windows-ollama-models.lock.json"
      - "native-windows-runtime-dependencies.lock.json"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "LICENSE-CODE"
      - "requirements-native-app.txt"
      - "requirements-native-app-build.txt"
      - "requirements-native-pyav-build.txt"
      - "scripts/build_native_app_payload.py"
      - "scripts/build_native_*.py"
      - "scripts/prove_native_app_reproducible.py"
      - "scripts/provision_native_*.py"
      - "scripts/verify_native_app_payload.py"
      - "scripts/collect_source_state.py"
      - "civiccast/**"
      - "tests/native/**"
      - "tests/captions/**"
      - "tests/egress/**"
      - "tests/stream/**"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repeat-build:
    name: Two independent Windows workspaces
    # workflow-cost: windows-pr-justification -- native payload byte equality requires Windows tooling.
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout workspace A
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: workspace-a

      - name: Checkout workspace B
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: workspace-b

      - name: Set up bootstrap Python only
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache reviewed immutable build inputs
        uses: actions/cache@v4
        with:
          path: |
            toolchain-cache
            workspace-a/build/native-pyav-cache
            workspace-b/build/native-pyav-cache
          key: native-app-repro-v1-${{ hashFiles('workspace-a/native-windows-build-toolchain.lock.json', 'workspace-a/native-windows-runtime-dependencies.lock.json', 'workspace-a/native-windows-ollama-models.lock.json', 'workspace-a/requirements-native-app.txt', 'workspace-a/requirements-native-app-build.txt', 'workspace-a/requirements-native-pyav-build.txt') }}

      - name: Provision exact portable tools and fixed MSVC Build Tools
        shell: pwsh
        run: |
          python -I -B workspace-a/scripts/provision_native_build_toolchain.py `
            --cache toolchain-cache `
            --output toolchain `
            --msvc-install msvc-build-tools

      - name: Acquire pinned payload interpreter
        shell: pwsh
        run: |
          $destination = "python-3.12.10-embed-amd64.zip"
          $url = "https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile $destination
          $size = (Get-Item -LiteralPath $destination).Length
          if ($size -ne 11133606) {
            throw "Embeddable Python size $size does not match reviewed 11133606"
          }
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $destination).Hash.ToLowerInvariant()
          $expected = "4acbed6dd1c744b0376e3b1cf57ce906f9dc9e95e68824584c8099a63025a3c3"
          if ($actual -ne $expected) {
            throw "Embeddable Python SHA-256 $actual does not match reviewed $expected"
          }

      - name: Reuse the exact pinned PyAV wheel from an existing release
        timeout-minutes: 10
        shell: pwsh
        working-directory: workspace-a
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_RELEASE: v1.0.0-beta.20
        run: |
          $ErrorActionPreference = 'Stop'
          $reuse = Join-Path $env:RUNNER_TEMP 'reviewed-pyav-reuse'
          New-Item -ItemType Directory -Path $reuse | Out-Null
          gh release download $env:REVIEWED_RELEASE --repo $env:GITHUB_REPOSITORY --pattern native-app-payload.ccpack --dir $reuse
          if ($LASTEXITCODE -ne 0) { throw 'Pinned PyAV source pack download failed.' }
          python -c "import ast,hashlib,pathlib,sys,zipfile;_MATCH=lambda n,name:(isinstance(n,ast.AnnAssign) and isinstance(n.target,ast.Name) and n.target.id==name) or (isinstance(n,ast.Assign) and len(n.targets)==1 and isinstance(n.targets[0],ast.Name) and n.targets[0].id==name);_CONST=lambda t,name:next(ast.literal_eval(n.value) for n in t.body if _MATCH(n,name));app=ast.parse(pathlib.Path('scripts/build_native_app_payload.py').read_text(encoding='utf-8'));pyav=ast.parse(pathlib.Path('scripts/build_native_pyav_wheel.py').read_text(encoding='utf-8'));wheel_name=_CONST(app,'REVIEWED_PYAV_WHEEL_NAME');wheel_bytes=_CONST(pyav,'EXPECTED_WHEEL_BYTES');wheel_sha=_CONST(pyav,'EXPECTED_WHEEL_SHA256');p=pathlib.Path(sys.argv[1]);z=zipfile.ZipFile(p/'native-app-payload.ccpack');names=[n for n in z.namelist() if n.endswith('/WHEELS/'+wheel_name) or n=='WHEELS/'+wheel_name];assert len(names)==1,names;data=z.read(names[0]);assert len(data)==wheel_bytes and hashlib.sha256(data).hexdigest()==wheel_sha,'Reviewed wheel identity mismatch';(p/wheel_name).write_bytes(data)" $reuse
          if ($LASTEXITCODE -ne 0) { throw 'Existing wheel does not match the unchanged reviewed pin.' }
          [IO.File]::Delete((Join-Path $reuse 'native-app-payload.ccpack'))
          "CIVICCAST_REVIEWED_PYAV_WHEEL=$reuse\av-18.0.0-cp311-abi3-win_amd64.whl" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build twice and require byte equality
        shell: pwsh
        env:
          CIVICCAST_MSVC_INSTALLATION_PATH: ${{ github.workspace }}\msvc-build-tools
        run: |
          python -I -B workspace-a/scripts/prove_native_app_reproducible.py `
            --workspace-a workspace-a `
            --workspace-b workspace-b `
            --output-a payload-a `
            --output-b payload-b `
            --scratch-a scratch-a `
            --scratch-b scratch-b `
            --toolchain toolchain `
            --interpreter-zip python-3.12.10-embed-amd64.zip `
            --reviewed-pyav-wheel "$env:CIVICCAST_REVIEWED_PYAV_WHEEL" `
            --receipt evidence/native-app-reproducibility.json

      - name: Upload repeat-build proof
        uses: actions/upload-artifact@v4
        timeout-minutes: 30
        with:
          name: native-app-reproducibility
          path: |
            evidence/native-app-reproducibility.json
            payload-a/app-payload-manifest.json
            payload-a/SHA256SUMS
            payload-b/app-payload-manifest.json
            payload-b/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
