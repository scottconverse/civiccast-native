name: Native Windows app-payload reproducibility

on:
  pull_request:
    branches: [main, 'program/**']
    paths:
      - ".github/workflows/native-app-reproducibility.yml"
      - "native-windows-build-toolchain.lock.json"
      - "native-windows-ollama-models.lock.json"
      - "native-windows-runtime-dependencies.lock.json"
      - "native-windows-ocr.lock.json"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "LICENSE-CODE"
      - "requirements-native-app.txt"
      - "requirements-native-app-build.txt"
      - "requirements-native-pyav-build.txt"
      - "scripts/build_native_app_payload.py"
      - "scripts/build_native_*.py"
      - "scripts/prove_native_app_reproducible.py"
      - "scripts/provision_native_*.py"
      - "scripts/verify_native_app_payload.py"
      - "scripts/collect_source_state.py"
      - "civiccast/**"
      - "tests/native/**"
      - "tests/captions/**"
      - "tests/egress/**"
      - "tests/stream/**"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stage-reviewed-inputs:
    name: Transfer verified reviewed inputs
    # Never check out or execute PR source on the internal runner. Forks cannot use it.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ fromJSON('["self-hosted","windows","sandbox-lab"]') }}
    timeout-minutes: 10
    concurrency:
      group: sandbox-lab
      cancel-in-progress: false
    steps:
      - name: Copy and independently verify immutable mirror inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mirror = 'C:\CivicCastTester\runtime-artifact-mirror'
          $destination = Join-Path $env:RUNNER_TEMP 'native-app-reviewed-inputs'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          $inputs = @(
            @{ Name = 'python-3.12.16-civiccast-embed-amd64.zip'; Bytes = 11474063; SHA256 = 'b06074f51101293e2d81059dde190ba9325665e926e4e2a16c0e3916c49be9db' },
            @{ Name = 'av-18.0.0-cp311-abi3-win_amd64.whl'; Bytes = 4348926; SHA256 = '5ab3fae3f85d4121919f70643e026452eb2a678b4a3f557b9ca487724c1399f0' }
          )
          foreach ($inputFile in $inputs) {
            $source = Join-Path $mirror $inputFile.Name
            if (!(Test-Path -LiteralPath $source -PathType Leaf)) { throw "Reviewed mirror input missing: $source. Stage the reviewed file before retrying." }
            $target = Join-Path $destination $inputFile.Name
            Copy-Item -LiteralPath $source -Destination $target
            if ((Get-Item -LiteralPath $target).Length -ne $inputFile.Bytes) { throw "Reviewed input size mismatch: $target" }
            $actual = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $inputFile.SHA256) { throw "Reviewed input SHA-256 mismatch: $target" }
          }
      - name: Transfer reviewed input bytes to hosted build
        uses: actions/upload-artifact@v4
        with:
          name: native-app-reviewed-inputs
          path: |
            ${{ runner.temp }}/native-app-reviewed-inputs/python-3.12.16-civiccast-embed-amd64.zip
            ${{ runner.temp }}/native-app-reviewed-inputs/av-18.0.0-cp311-abi3-win_amd64.whl
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  repeat-build:
    needs: stage-reviewed-inputs
    name: Two independent Windows workspaces
    # workflow-cost: windows-pr-justification -- native payload byte equality requires Windows tooling.
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout workspace A
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: workspace-a

      - name: Checkout workspace B
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: workspace-b

      - name: Set up bootstrap Python only
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache reviewed immutable build inputs
        uses: actions/cache@v4
        with:
          path: |
            toolchain-cache
            workspace-a/build/native-pyav-cache
            workspace-b/build/native-pyav-cache
          key: native-app-repro-v1-${{ hashFiles('workspace-a/native-windows-build-toolchain.lock.json', 'workspace-a/native-windows-runtime-dependencies.lock.json', 'workspace-a/native-windows-ollama-models.lock.json', 'workspace-a/requirements-native-app.txt', 'workspace-a/requirements-native-app-build.txt', 'workspace-a/requirements-native-pyav-build.txt') }}

      - name: Provision exact portable tools and fixed MSVC Build Tools
        shell: pwsh
        run: |
          python -I -B workspace-a/scripts/provision_native_build_toolchain.py `
            --cache toolchain-cache `
            --output toolchain `
            --msvc-install msvc-build-tools

      - name: Download reviewed inputs from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: native-app-reviewed-inputs
          path: reviewed-inputs

      - name: Recheck source pins and embedded provenance on hosted runner
        shell: pwsh
        run: |
          @'
          import ast, hashlib, json, pathlib, runpy, zipfile
          root = pathlib.Path('workspace-a')
          def constant(path, name):
              tree = ast.parse((root / path).read_text(encoding='utf-8'))
              for node in tree.body:
                  targets = [node.target] if isinstance(node, ast.AnnAssign) else node.targets if isinstance(node, ast.Assign) else []
                  if any(isinstance(target, ast.Name) and target.id == name for target in targets):
                      return ast.literal_eval(node.value)
              raise ValueError(f'Missing reviewed constant: {name}')
          app = 'civiccast/native/app_payload.py'
          runtime = 'civiccast/native/python_runtime.py'
          pyav = runpy.run_path(str(root / 'scripts/build_native_pyav_wheel.py'))
          inputs = pathlib.Path('reviewed-inputs').resolve()
          interpreter = inputs / 'python-3.12.16-civiccast-embed-amd64.zip'
          wheel = inputs / 'av-18.0.0-cp311-abi3-win_amd64.whl'
          for path, size, digest in (
              (interpreter, constant(app, 'INTERPRETER_ZIP_BYTES'), constant(app, 'INTERPRETER_SHA256')),
              (wheel, pyav['EXPECTED_WHEEL_BYTES'], pyav['EXPECTED_WHEEL_SHA256']),
          ):
              data = path.read_bytes()
              assert len(data) == size and hashlib.sha256(data).hexdigest() == digest, f'Reviewed input identity mismatch: {path}'
          with zipfile.ZipFile(interpreter) as archive:
              provenance = archive.read(constant(runtime, 'PROVENANCE_PATH'))
              assert hashlib.sha256(provenance).hexdigest() == constant(runtime, 'PROVENANCE_SHA256'), 'Interpreter provenance mismatch'
          with zipfile.ZipFile(wheel) as archive:
              assert json.loads(archive.read(pyav['_PROVENANCE'])) == pyav['ffmpeg_provenance'](), 'PyAV source/security-patch provenance mismatch'
          with pathlib.Path(__import__('os').environ['GITHUB_ENV']).open('a', encoding='utf-8') as env:
              env.write(f'CIVICCAST_INTERPRETER_ZIP={interpreter}\nCIVICCAST_REVIEWED_PYAV_WHEEL={wheel}\n')
          '@ | python -I -B -
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed input or provenance verification failed.' }

      - name: Build twice and require byte equality
        shell: pwsh
        env:
          CIVICCAST_MSVC_INSTALLATION_PATH: ${{ github.workspace }}\msvc-build-tools
        run: |
          python -I -B workspace-a/scripts/prove_native_app_reproducible.py `
            --workspace-a workspace-a `
            --workspace-b workspace-b `
            --output-a payload-a `
            --output-b payload-b `
            --scratch-a scratch-a `
            --scratch-b scratch-b `
            --toolchain toolchain `
            --interpreter-zip "$env:CIVICCAST_INTERPRETER_ZIP" `
            --reviewed-pyav-wheel "$env:CIVICCAST_REVIEWED_PYAV_WHEEL" `
            --receipt evidence/native-app-reproducibility.json

      - name: Upload repeat-build proof
        uses: actions/upload-artifact@v4
        timeout-minutes: 30
        with:
          name: native-app-reproducibility
          path: |
            evidence/native-app-reproducibility.json
            payload-a/app-payload-manifest.json
            payload-a/SHA256SUMS
            payload-b/app-payload-manifest.json
            payload-b/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
