# SPDX-License-Identifier: Apache-2.0
name: ci-test

# Native-Windows program (WS2): program/** added so PRs targeting the
# program integration branch get the same execution proof as main-line PRs
# (the Postgres restore drill's evidence is this workflow's Docker gate).
on:
  pull_request:
    branches: [main, 'program/**', 'release/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    # Keep the media prerequisite stack on the last passing image (run40321638869).
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # TEST-001 (audit-team v0.3.0 + Scott independent audit Step 2):
    # The schedule module's btree_gist EXCLUDE conflict-detection contract
    # is verified exclusively against real Postgres in
    # tests/schedule/test_real_postgres.py. Through v0.3.0 those 10 tests
    # silently skipped on every push because no CI runner had Docker
    # available for testcontainers; CIVICCAST_RUN_POSTGRES_TESTS=1 below
    # flips the skip into a hard failure if Docker isn't reachable, so a
    # silent regression cannot ship green.
    env:
      CIVICCAST_RUN_POSTGRES_TESTS: "1"
    steps:
      - name: Checkout
        # ws3 claims-evidence (D3): explicit PR-head checkout so this
        # producer's tested SHA is never the pull_request synthetic merge
        # commit (GITHUB_SHA). Falls back to github.sha on push/non-PR
        # events, where there is no separate head to pin to.
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Emit producer meta (ws3 claims-evidence D3)
        run: python3 scripts/policy/emit_producer_meta.py --job-id test --out test-meta.json

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install media test prerequisites
        # Shared with deterministic-detectors.yml's randomized-suite job --
        # see scripts/ci/install_media_test_prerequisites.sh for the full
        # rationale (dpkg-lock wait + slow-mirror handling, both confirmed
        # hosted-runner failure modes with real job-ID evidence in the
        # script's header comment). timeout-minutes raised from 10: the
        # script's own internal per-apt-call timeouts (8 min each, up to 3
        # calls) need headroom to actually run to completion on a slow
        # mirror rather than being killed by the step wrapper first.
        timeout-minutes: 30
        run: bash scripts/ci/install_media_test_prerequisites.sh

      - name: Install project (dev)
        # --no-extra agenda-js-import: every other optional-dependency group
        # (captions-runtime, cloudflare-r2, s3-cdn) is pure-Python or only
        # needs its package installed to be exercised; agenda-js-import
        # (crawl4ai + Playwright) additionally needs `playwright install
        # chromium` -- a separate ~300 MB browser-binary download this job
        # does not perform. Installing the crawl4ai PACKAGE without staging
        # that binary is worse than not installing it at all: it makes
        # civiccast.agenda_import.js_portal's "not installed" posture
        # genuinely false in CI while a real crawl still cannot launch a
        # browser, which is exactly the gap that broke this job (see
        # tests/agenda_import/test_js_portal.py -- those tests are hermetic
        # via monkeypatch/sys.modules regardless of what's installed here,
        # so excluding the extra is a CI-cost decision, not a coverage gap).
        run: uv sync --all-extras --no-extra agenda-js-import --group dev

      - name: Probe Docker (testcontainers prerequisite)
        # Fail loud at this step rather than letting testcontainers fall
        # through with a ResourceWarning ??? easier to diagnose for future
        # maintainers if the runner image ever drops Docker access.
        run: |
          if ! [ -S /var/run/docker.sock ] && [ -z "${DOCKER_HOST:-}" ]; then
            echo "::error::Docker socket not present; testcontainers cannot spin up Postgres for TEST-001."
            exit 1
          fi
          docker version >/dev/null

      - name: pytest
        # TEST-001 (audit-team v0.3.0 + Scott independent audit Step 2):
        # Run the suite with JUnit XML output so the next step can parse
        # the *actual executed* test count for tests/schedule/test_real_postgres.py.
        # The earlier --collect-only assertion proved collection only,
        # not execution; Scott's correction-directive Step 4 required
        # tightening this.
        run: |
          if [ -d tests ] && [ -n "$(find tests -name 'test_*.py' -o -name '*_test.py' 2>/dev/null)" ]; then
            uv run pytest -v \
              --ignore=tests/native \
              -m "not integration" \
              --cov=civiccast --cov-report=term-missing \
              --cov-fail-under=60 \
              --junitxml=junit.xml
          else
            echo "No tests yet ??? placeholder green for Day 0; Sprint 0.1 lands the first tests."
          fi

      - name: Caption review contract on isolated PostgreSQL (no skips)
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          container=$(docker run -d -e POSTGRES_HOST_AUTH_METHOD=trust -p 127.0.0.1::5432 postgres:17 -c shared_buffers=16MB -c max_connections=10 -c max_wal_senders=0)
          trap 'docker rm -f "$container"' EXIT
          for _ in $(seq 1 30); do
            if docker exec "$container" pg_isready -U postgres; then break; fi
            sleep 1
          done
          docker exec "$container" pg_isready -U postgres
          address=$(docker port "$container" 5432/tcp)
          export CIVICCAST_POSTGRES_TEST_URL="postgresql+psycopg://postgres@${address}/postgres"
          uv run python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          import pytest
          nodes = """
          tests/captions/test_review_persistence.py::TestRealPostgres::test_contract_round_trip_on_real_postgres
          """.strip().splitlines()
          code = pytest.main([*nodes, "-q", "-ra", "--no-cov", "--junitxml=junit-caption-postgres.xml"])
          if code:
              sys.exit(code)
          cases = list(ET.parse("junit-caption-postgres.xml").iter("testcase"))
          assert len(cases) >= len(nodes), "Selected cases did not all execute"
          assert all(not any(c.find(tag) is not None for tag in ("skipped", "failure", "error")) for c in cases), "Selected coverage was skipped or failed"
          print(f"Required coverage executed: {len(cases)} passed, no skips")
          PY

      - name: Run tests/native's platform-independent suite (junit)
        run: uv run pytest tests/native -m "not windows_only" -q --junitxml=junit-native-pure.xml
      - name: Assert the recording-finalization real-media proofs actually ran
        # GauntletGate T3. These two tests are the ONLY end-to-end proof that a
        # finished broadcast finalizes into a real, duration-correct recording
        # via the app's own worker thread -- the path that turns a live meeting
        # into the permanent public-record asset (spec non-negotiable §4.6).
        # Both are gated on ffmpeg/ffprobe being on PATH. Three sibling suites
        # already have a floor guard for exactly this reason; these did not, so
        # a renamed apt package or a silently-failing install step on a future
        # runner image would have dropped the coverage with CI still green.
        if: always()
        run: |
          if [ ! -f junit.xml ]; then
            echo "::error::junit.xml missing — pytest did not run."
            exit 1
          fi
          python <<'PYFLOOR'
          import sys, xml.etree.ElementTree as ET

          REQUIRED = {
              "test_real_media_trim_proof_duration_matches_trim_window",
              "test_end_broadcast_reaches_completed_via_app_wired_worker",
          }
          tree = ET.parse("junit.xml")
          executed = set()
          skipped = set()
          for case in tree.iter("testcase"):
              if not case.get("classname", "").startswith("tests.live.test_finalization_worker"):
                  continue
              name = case.get("name", "")
              if name not in REQUIRED:
                  continue
              if case.find("skipped") is not None:
                  skipped.add(name)
                  continue
              if case.find("failure") is not None or case.find("error") is not None:
                  print(f"::error::Finalization proof {name} failed.")
                  sys.exit(1)
              executed.add(name)

          missing = REQUIRED - executed
          if missing:
              print(
                  f"::error::Recording-finalization real-media proof did not execute: "
                  f"{sorted(missing)} (skipped={sorted(skipped)}). ffmpeg/ffprobe "
                  "missing on the runner, or the tests were renamed without "
                  "updating this guard."
              )
              sys.exit(1)
          print(f"Finalization real-media proofs executed: {sorted(executed)}")
          PYFLOOR

      - name: Assert the item 66 conform-cache real-ffmpeg proofs actually ran
        # Item 66 round-9 (MEDIUM fix): tests/egress/test_preparer_conform_cache_real_ffmpeg.py
        # is the only end-to-end proof that the round-7/8 full-asset-conform-cache
        # gate fixes (a slot-capped untrimmed segment must never poison the
        # persistent cache as if it were the whole asset) hold against a real,
        # measured output duration rather than just which code path fired. All
        # four tests are gated on ffmpeg/ffprobe being on PATH (same
        # `pytestmark = pytest.mark.skipif(...)` shape as the finalization-worker
        # suite above), so without this guard a runner image that silently lost
        # ffmpeg/ffprobe would drop this coverage with CI still green.
        if: always()
        run: |
          if [ ! -f junit.xml ]; then
            echo "::error::junit.xml missing — pytest did not run."
            exit 1
          fi
          python <<'PYFLOOR'
          import sys, xml.etree.ElementTree as ET

          REQUIRED = {
              "test_slot_capped_untrimmed_segment_then_longer_slot_no_dead_air",
              "test_repeated_shorter_slot_still_hits_the_real_full_asset_cache",
              "test_ffprobe_unavailable_never_promotes_a_fragment_as_full_asset",
              "test_trimmed_airing_then_slot_capped_untrimmed_does_not_poison_cache",
          }
          tree = ET.parse("junit.xml")
          executed = set()
          skipped = set()
          for case in tree.iter("testcase"):
              if not case.get("classname", "").startswith(
                  "tests.egress.test_preparer_conform_cache_real_ffmpeg"
              ):
                  continue
              name = case.get("name", "")
              if name not in REQUIRED:
                  continue
              if case.find("skipped") is not None:
                  skipped.add(name)
                  continue
              if case.find("failure") is not None or case.find("error") is not None:
                  print(f"::error::Conform-cache real-ffmpeg proof {name} failed.")
                  sys.exit(1)
              executed.add(name)

          missing = REQUIRED - executed
          if missing:
              print(
                  f"::error::Conform-cache real-ffmpeg proof did not execute: "
                  f"{sorted(missing)} (skipped={sorted(skipped)}). ffmpeg/ffprobe "
                  "missing on the runner, or the tests were renamed without "
                  "updating this guard."
              )
              sys.exit(1)
          print(f"Conform-cache real-ffmpeg proofs executed: {sorted(executed)}")
          PYFLOOR

      - name: Assert the live-HLS playability proof actually ran
        # 1.0-hardening: the single most important behavioral test in the repo
        # (real ffmpeg + ffprobe rolling-live-window playability,
        # tests/egress/test_hls_sink_live_playability.py) previously ran only
        # incidentally, with nothing failing CI if it silently skipped. Same
        # junit-floor pattern as the real-Postgres guard below.
        if: always()
        run: |
          if [ ! -f junit.xml ]; then
            echo "::error::junit.xml missing ??? pytest did not run."
            exit 1
          fi
          python <<'PYFLOOR'
          import sys, xml.etree.ElementTree as ET
          tree = ET.parse("junit.xml")
          ran = skipped = 0
          for case in tree.iter("testcase"):
              if not case.get("classname", "").startswith("tests.egress.test_hls_sink_live_playability"):
                  continue
              if case.find("skipped") is not None:
                  skipped += 1
                  continue
              if case.find("failure") is not None or case.find("error") is not None:
                  print(f"::error::Playability test {case.get('name')} failed.")
                  sys.exit(1)
              ran += 1
          if ran < 1:
              print(f"::error::Live-HLS playability proof did not execute (ran={ran}, skipped={skipped}) ??? ffmpeg/ffprobe missing on the runner?")
              sys.exit(1)
          print(f"Playability proof executed: {ran} test(s), {skipped} skipped.")
          PYFLOOR

      - name: Assert real-Postgres tests actually ran
        # TEST-009 anti-pattern guard. Parse junit.xml for testcases whose
        # classname starts with tests.schedule.test_real_postgres and
        # require status = passed (no skipped, no error). Fail loud if
        # the count drops below the documented floor.
        if: always()
        run: |
          if [ ! -f junit.xml ]; then
            echo "::error::junit.xml missing ??? pytest did not run."
            exit 1
          fi
          # Extract the executed real-Postgres pass count.
          # python is already on the runner via setup-python.
          python <<'PYEOF'
          import sys, xml.etree.ElementTree as ET

          tree = ET.parse("junit.xml")
          ran = 0
          skipped = 0
          for case in tree.iter("testcase"):
              cls = case.get("classname", "")
              if not cls.startswith("tests.schedule.test_real_postgres"):
                  continue
              if case.find("skipped") is not None:
                  skipped += 1
                  continue
              if case.find("failure") is not None or case.find("error") is not None:
                  print(f"::error::Real-Postgres test {cls}::{case.get('name')} failed.")
                  sys.exit(1)
              ran += 1

          floor = 5
          print(f"Real-Postgres tests passed: {ran} (skipped: {skipped}; floor: {floor})")
          if ran < floor:
              print(
                  f"::error::Real-Postgres pass count {ran} < floor {floor}. "
                  "TEST-001 is unproven on this run."
              )
              sys.exit(1)
          PYEOF

      - name: Assert the real-Postgres concurrent preflight race passed
        # Real Postgres must execute the conditional start-preflight update
        # atomically. Require the exact row-level contention test in the same
        # JUnit produced by the full suite; collection or a skip is not
        # execution proof.
        if: always()
        run: |
          if [ ! -f junit.xml ]; then
            echo "::error::junit.xml missing - pytest did not run."
            exit 1
          fi
          python <<'PYCAS'
          import sys, xml.etree.ElementTree as ET

          expected_class = (
              "tests.live.test_real_postgres."
              "TestRealPostgresLiveSessionStateMachineConcurrency"
          )
          expected_name = "test_two_concurrent_start_preflight_exactly_one_wins"
          matches = [
              case
              for case in ET.parse("junit.xml").iter("testcase")
              if case.get("classname") == expected_class
              and case.get("name") == expected_name
          ]
          if len(matches) != 1:
              print(
                  f"::error::Expected exactly one concurrent preflight testcase; "
                  f"found {len(matches)}."
              )
              sys.exit(1)
          case = matches[0]
          if case.find("skipped") is not None:
              print("::error::Concurrent preflight real-Postgres proof was skipped.")
              sys.exit(1)
          if case.find("failure") is not None or case.find("error") is not None:
              print("::error::Concurrent preflight real-Postgres proof failed.")
              sys.exit(1)
          print("Concurrent preflight real-Postgres proof executed and passed.")
          PYCAS

      - name: Assert Postgres restore-drill tests actually ran
        # WS2 (native-Windows program): same junit-floor pattern as the
        # real-Postgres guard above. The DR suite hard-fails on missing
        # Docker under CIVICCAST_RUN_POSTGRES_TESTS=1, but the floor also
        # catches collection errors and file renames reading as green.
        if: always()
        run: |
          if [ ! -f junit.xml ]; then
            echo "::error::junit.xml missing - pytest did not run."
            exit 1
          fi
          python <<'PYDR'
          import sys, xml.etree.ElementTree as ET

          tree = ET.parse("junit.xml")
          ran = skipped = 0
          for case in tree.iter("testcase"):
              cls = case.get("classname", "")
              if not cls.startswith("tests.dr.test_postgres_restore"):
                  continue
              if case.find("skipped") is not None:
                  skipped += 1
                  continue
              if case.find("failure") is not None or case.find("error") is not None:
                  print(f"::error::Postgres restore-drill test {cls}::{case.get('name')} failed.")
                  sys.exit(1)
              ran += 1

          # <installer-path-audit MA-38> The floor is now DERIVED, not typed.
          #
          # It used to be the literal `20`, with a comment saying it "must be
          # bumped to match whenever a test is added to that file". It was not:
          # `grep -c "^def test_"` returned 21, because PR #143 added
          # test_postgres_restore_drill_expected_revision_overrides_code_head --
          # the file's ONLY proof of its own fix -- and did not bump the
          # number. That test could then be skipped or deleted with this guard
          # still green, which is precisely the failure the guard exists to
          # prevent. Counting the definitions closes the class rather than the
          # instance: a stale floor is now impossible by construction.
          #
          # Parametrized tests expand into several junit cases, so `ran` is
          # always >= the definition count; this is a floor, not an equality.
          import re
          from pathlib import Path

          source = Path("tests/dr/test_postgres_restore.py").read_text(encoding="utf-8")
          floor = len(re.findall(r"^def test_", source, re.MULTILINE))
          if floor == 0:
              print("::error::Could not derive the restore-drill floor: no test definitions found.")
              sys.exit(1)
          print(f"Postgres restore-drill tests passed: {ran} (skipped: {skipped}; floor: {floor})")
          if ran < floor:
              print(
                  f"::error::Postgres restore-drill pass count {ran} < floor {floor}. "
                  "The WS2 restore drill is unproven on this run."
              )
              sys.exit(1)
          PYDR

      - name: Assert real-Postgres staff-auth tests actually ran
        if: always()
        run: |
          if [ ! -f junit.xml ]; then
            echo "::error::junit.xml missing - pytest did not run."
            exit 1
          fi
          python <<'PYAUTH'
          import sys, xml.etree.ElementTree as ET

          tree = ET.parse("junit.xml")
          ran = skipped = 0
          for case in tree.iter("testcase"):
              cls = case.get("classname", "")
              if not cls.startswith("tests.auth.test_staff_token_lifecycle"):
                  continue
              name = case.get("name", "")
              if not (
                  name == "test_postgres_audit_order_is_deterministic_under_collisions"
                  or name == "test_real_postgres_valid_token_survives_shared_ip_failure_budget"
              ):
                  continue
              if case.find("skipped") is not None:
                  skipped += 1
                  continue
              if case.find("failure") is not None or case.find("error") is not None:
                  print(f"::error::Real-Postgres staff-auth test {cls}::{name} failed.")
                  sys.exit(1)
              ran += 1

          floor = 2
          print(f"Real-Postgres staff-auth tests passed: {ran} (skipped: {skipped}; floor: {floor})")
          if ran < floor:
              print(
                  f"::error::Real-Postgres staff-auth pass count {ran} < floor {floor}. "
                  "The production auth boundary is unproven on this run."
              )
              sys.exit(1)
          PYAUTH

      - name: Assert tests/native's platform-independent (pure) suite actually ran
        # WS4 (native-Windows program, slice:ws4-dual-runtime-guard): the
        # Windows-only real-probe tests (tests/native/test_win_probes.py --
        # "win" is in every Windows-only test module/name by convention) skip
        # here on ubuntu; every OTHER tests/native module (the D3 decision
        # table, GuardMonitor, models, and the CLI orchestration -- all
        # fully fake/injected, no OS dependency) must actually PASS, not just
        # collect. This WP1 repair replaces the old name-substring selector;
        # regenerate and bind the final JUnit identity receipt after
        # candidate freeze.
        #
        # 2026-08-30 floor audit: this pin had sat at 1429 unmoved since the
        # repo's first commit while the real collection grew to 1675 -- 246
        # tests of undetected slack, found by `git log -S` showing the
        # literal never changed. Floor = the real current collection count
        # (1675, verified live via `pytest --collect-only tests/native -m
        # "not windows_only"` immediately before this change) minus a fixed
        # 50-test margin, not the exact count itself: an exact pin fails the
        # build the moment anyone legitimately consolidates or removes even
        # one test, and this suite's own maintained history (see
        # NATIVE_JUNIT_FLOOR_MARGIN and the comment trail in
        # tests/policy/test_native_caption_workflow_policy.py) shows normal
        # PRs add low tens of tests at a time -- 50 survives a PR or two of
        # that churn while still catching anything on the order of a whole
        # module silently failing to run. tests/policy's
        # test_native_junit_workflow_floors_match_current_exact_collections
        # enforces this floor stays within that margin of a FRESH collection
        # on every run (not a second hardcoded number), so this pin cannot
        # go stale again the way 1429 did without failing that test first.
        # 2026-10-09 CI collection audit: 1959 pure tests; that checkpoint's
        # 50-test-margin floor was 1909.
        # 2026-10-12 Beta 14 collection: 1985 pure tests, with a floor of 1935.
        # 2026-10-13 station-operations collection: 2024 pure tests after
        # marking six Windows-only identity/DPAPI cases; preserve the same
        # 50-test margin with a floor of 1974. The 2026-10-14 Beta16 license
        # closure assertion added one pure test (floor 1975).
        # 2026-10-19: 2029 pure tests; floor 1983 leaves a 46-test margin.
        # RC1 native packaging/security regressions: 2145 pure tests; floor 2095
        # keeps the standard 50-test margin.
        if: always()
        run: |
          python scripts/verify_native_junit_floor.py \
            --junit junit-native-pure.xml \
            --floor 2095 \
            --label "tests/native pure suite"

      - name: Upload junit (ws3 claims-evidence D3/D7)
        if: always()
        uses: actions/upload-artifact@v7.0.1
        timeout-minutes: 10
        with:
          name: test-junit
          path: |
            junit.xml
            junit-native-pure.xml
            junit-caption-postgres.xml
          if-no-files-found: error
          retention-days: 1

      - name: Upload producer meta (ws3 claims-evidence D3/D7)
        if: always()
        uses: actions/upload-artifact@v7.0.1
        timeout-minutes: 10
        with:
          name: test-meta
          path: test-meta.json
          if-no-files-found: warn
          retention-days: 1

  stage-native-runtime-inputs:
    name: Transfer verified native runtime inputs
    # No checkout or PR code runs on this runner. Forks cannot use the local mirror.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON('["self-hosted","windows","sandbox-lab"]') }}
    timeout-minutes: 10
    concurrency:
      group: sandbox-lab
      cancel-in-progress: false
    steps:
      - name: Copy and independently verify reviewed native runtime archives
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mirror = 'C:\CivicCastTester\runtime-artifact-mirror'
          $destination = Join-Path $env:RUNNER_TEMP 'native-runtime-reviewed-inputs'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          $inputs = @(
            @{ Name = 'openssl-3.5.9-civiccast-windows-x64.zip'; Bytes = 2805153; SHA256 = '062f6d64ae51eb970e46422e6791bced241867574179aa278a82a08245f82491' },
            @{ Name = 'glib-2.88.4-libsoup-3.8.1-nghttp2-1.70.0-civiccast-windows-x64.zip'; Bytes = 1966069; SHA256 = '34da86644a17511887de4f01b7ea18708f07c15e1f92f1448dda68166eebe6b9' },
            @{ Name = 'ffmpeg-7.1.5-security1-gstreamer-windows-x64.zip'; Bytes = 1968427; SHA256 = '40cf143eda356ea14573323c8dcfbd4c4e33c83a2510e50bbaae95912b143246' },
            @{ Name = 'civiccast-rc1-security-libraries-windows-x64.zip'; Bytes = 2666766; SHA256 = '6545e5f76472135310815f68296b427a8efc9810ba28a4c4c919241cfd04e683' }
          )
          foreach ($inputFile in $inputs) {
            $source = Join-Path $mirror $inputFile.Name
            if (!(Test-Path -LiteralPath $source -PathType Leaf)) { throw "Reviewed mirror input missing: $source. Stage the reviewed archive before retrying." }
            $target = Join-Path $destination $inputFile.Name
            Copy-Item -LiteralPath $source -Destination $target
            if ((Get-Item -LiteralPath $target).Length -ne $inputFile.Bytes) { throw "Reviewed runtime archive size mismatch: $target" }
            $actual = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $inputFile.SHA256) { throw "Reviewed runtime archive SHA-256 mismatch: $target" }
          }
      - name: Transfer reviewed native runtime bytes to hosted runner
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: native-runtime-reviewed-inputs
          path: |
            ${{ runner.temp }}/native-runtime-reviewed-inputs/openssl-3.5.9-civiccast-windows-x64.zip
            ${{ runner.temp }}/native-runtime-reviewed-inputs/glib-2.88.4-libsoup-3.8.1-nghttp2-1.70.0-civiccast-windows-x64.zip
            ${{ runner.temp }}/native-runtime-reviewed-inputs/ffmpeg-7.1.5-security1-gstreamer-windows-x64.zip
            ${{ runner.temp }}/native-runtime-reviewed-inputs/civiccast-rc1-security-libraries-windows-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # Native media uses the product GStreamer closure, without station/model packs.
  windows-native:
    needs: stage-native-runtime-inputs
    name: WS4 dual-runtime guard (real Windows probes)
    # workflow-cost: windows-pr-justification -- Windows registry, process-table, and WSL probes require a hosted Windows runner.
    # slice:ws4-dual-runtime-guard -- SDR-001's point that fixture-only proof
    # is insufficient applies here: tests/native/test_win_probes.py touches
    # the real registry, the real process table, and real wsl.exe. This job
    # is that proof running for real, not just "pure" tests/native on ubuntu.
    runs-on: windows-latest
    timeout-minutes: 60
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download reviewed native runtime archives from this workflow run
        timeout-minutes: 5
        uses: actions/download-artifact@v4
        with:
          name: native-runtime-reviewed-inputs
          path: native-runtime-reviewed-inputs

      - name: Recheck reviewed native runtime archives against source locks
        shell: pwsh
        run: |
          @'
          import hashlib, json, os
          from pathlib import Path
          inputs = Path('native-runtime-reviewed-inputs').resolve()
          reviewed = (
              ('native-windows-openssl.lock.json', 'openssl-3.5.9-civiccast-windows-x64.zip', 'CIVICCAST_OPENSSL_RUNTIME_ZIP'),
              ('native-windows-glib-soup.lock.json', 'glib-2.88.4-libsoup-3.8.1-nghttp2-1.70.0-civiccast-windows-x64.zip', 'CIVICCAST_GLIB_SOUP_RUNTIME_ZIP'),
              ('native-windows-gstreamer-ffmpeg.lock.json', 'ffmpeg-7.1.5-security1-gstreamer-windows-x64.zip', 'CIVICCAST_GSTREAMER_FFMPEG_RUNTIME_ZIP'),
              ('native-windows-security-libraries.lock.json', 'civiccast-rc1-security-libraries-windows-x64.zip', 'CIVICCAST_SECURITY_LIBRARIES_ZIP'),
          )
          environment = []
          for lockfile, filename, variable in reviewed:
              pin = json.loads(Path(lockfile).read_text(encoding='utf-8'))['archive']
              assert pin.get('filename', pin.get('name')) == filename, f'Reviewed archive filename mismatch: {lockfile}'
              archive = inputs / filename
              data = archive.read_bytes()
              assert len(data) == pin['bytes'] and hashlib.sha256(data).hexdigest() == pin['sha256'], f'Reviewed archive identity mismatch: {filename}'
              environment.append(f'{variable}={archive}\n')
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as output:
              output.writelines(environment)
          '@ | python -I -B -
          if ($LASTEXITCODE -ne 0) { throw 'Native runtime archive verification against committed locks failed.' }

      - name: Install ffmpeg for native media tests
        timeout-minutes: 10
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install project (dev)
        run: uv sync --group dev

      - name: Provision pinned GStreamer closure, TSDuck and NSIS test tools
        timeout-minutes: 20
        shell: pwsh
        run: |
          $runtime = (Resolve-Path .venv/Scripts).Path
          uv run python scripts/build_native_runtime_closure.py --stage "$env:RUNNER_TEMP/gstreamer-stage" --out "$runtime/dependencies/gstreamer"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run python scripts/verify_native_runtime_closure.py --tree "$runtime/dependencies/gstreamer"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CIVICCAST_GSTREAMER_RUNTIME_ROOT=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          @'
          import os
          from pathlib import Path
          from scripts.provision_native_runtime_dependencies import load_lock, fetch_locked_artifact, safe_extract_zip
          artifact = load_lock()["artifacts"]["tsduck"]
          archive = fetch_locked_artifact("tsduck", artifact, Path(os.environ["RUNNER_TEMP"]) / "media-downloads")
          destination = Path(os.environ["RUNNER_TEMP"]) / "tsduck"
          safe_extract_zip(archive, destination, strip_prefix=artifact["strip_prefix"], include=artifact.get("include"))
          assert (destination / "bin/tsp.exe").is_file()
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as handle:
              handle.write(str(destination / "bin") + "\n")
          # The same Tauri NSIS 3.11 layout used by the four compile/preflight fixtures.
          # Pin the tiny upstream tool archive; no installer/app/model build is needed.
          nsis = {
              "filename": "nsis-3.11.zip", "bytes": 2361546,
              "sha256": "c7d27f780ddb6cffb4730138cd1591e841f4b7edb155856901cdf5f214394fa1",
              "url": "https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip",
          }
          archive = fetch_locked_artifact("Tauri NSIS", nsis, Path(os.environ["RUNNER_TEMP"]) / "media-downloads")
          compiler_root = Path.home() / "AppData/Local/tauri/NSIS"
          safe_extract_zip(archive, compiler_root, strip_prefix="nsis-3.11")
          assert (compiler_root / "Bin/makensis.exe").is_file()
          '@ | uv run python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $encoders = ffmpeg -hide_banner -encoders 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $encoders -notmatch 'libx264') { throw "FFmpeg fixture requires libx264" }
          $protocols = ffmpeg -hide_banner -protocols 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $protocols -notmatch '(?m)^\s+srt\s*$') { throw "FFmpeg fixture requires SRT" }

      - name: Run Windows installer and filesystem cases (no skips)
        timeout-minutes: 15
        shell: pwsh
        run: |
          $env:PSModulePath = "$env:WINDIR\System32\WindowsPowerShell\v1.0\Modules;$env:ProgramFiles\WindowsPowerShell\Modules"
          @'
          import sys, xml.etree.ElementTree as ET
          import pytest
          nodes = """
          tests/certs/test_private_key_acl.py::test_machine_account_name_grant_reproduces_1332_red
          tests/certs/test_private_key_acl.py::test_restrict_real_icacls_succeeds_and_grants_expected_principals
          tests/certs/test_private_key_acl.py::test_unregistered_service_sid_uses_native_acl_fallback
          tests/certs/test_private_key_acl.py::test_first_admin_completes_under_localsystem_username
          tests/dr/test_station_backup_runtime.py::test_runtime_backup_includes_station_state_and_portable_credentials
          tests/gate_a/test_gate_a_download_only_payload.py::test_builder_script_present
          tests/gate_a/test_gate_a_download_only_payload.py::test_download_only_payload_builder_produces_no_reparse_points_and_cleanup_restores_kit_download
          tests/gate_a/test_gate_a_download_only_payload.py::test_download_only_payload_builder_counts_forced_copy_fallback_within_threshold
          tests/gate_a/test_gate_a_download_only_payload.py::test_download_only_payload_builder_fails_closed_when_forced_copy_fallback_exceeds_tiny_threshold
          tests/installer/test_install_transaction.py::test_restores_files_activation_database_after_late_failure_and_preserves_media
          tests/installer/test_install_transaction.py::test_interrupted_restore_keeps_recovery_point_and_retries_idempotently
          tests/installer/test_install_transaction.py::test_dead_installer_recovery_restores_but_live_installer_is_untouched
          tests/installer/test_install_transaction.py::test_commit_keeps_candidate_and_recovery_cannot_roll_it_back
          tests/installer/test_install_transaction.py::test_restores_existing_shortcut_and_removes_only_new_installer_shortcut
          tests/installer/test_install_transaction.py::test_insufficient_snapshot_space_refuses_before_replacement
          tests/installer/test_install_transaction.py::test_snapshot_and_restore_keep_hardlinks_without_sharing_live_bytes
          tests/installer/test_install_transaction.py::test_service_restore_preserves_start_mode_and_prior_running_state
          tests/installer/test_nsis_bootstrap_hooks.py::test_transaction_macros_compile_with_tauri_early_hook_include[initial-tauri]
          tests/installer/test_nsis_bootstrap_hooks.py::test_transaction_macros_compile_with_tauri_early_hook_include[final-patched]
          tests/installer/test_nsis_bootstrap_hooks.py::test_version_preflight_preserves_extraction_destination_and_caller_state[False]
          tests/installer/test_nsis_bootstrap_hooks.py::test_version_preflight_preserves_extraction_destination_and_caller_state[True]
          tests/installer/test_wait_native_uninstall_cleanup.py::test_wait_succeeds_only_after_arp_and_install_root_disappear
          tests/installer/test_wait_native_uninstall_cleanup.py::test_wait_times_out_when_cleanup_never_completes
          tests/installer/test_wait_native_uninstall_cleanup.py::test_wait_times_out_when_only_arp_remains
          tests/installer/test_wait_native_uninstall_cleanup.py::test_wait_times_out_when_only_install_root_remains
          tests/installer/test_wait_native_uninstall_cleanup.py::test_default_roots_detect_standard_hkcu_arp_entry
          tests/policy/test_native_installer_identity.py::test_repository_install_progress_matchers_accept_timestamp_prefix
          tests/policy/test_windows_release_downloader.py::test_station_archive_verification_and_safe_extraction[complete]
          tests/policy/test_windows_release_downloader.py::test_station_archive_verification_and_safe_extraction[traversal]
          tests/policy/test_windows_release_downloader.py::test_station_archive_verification_and_safe_extraction[conflict]
          tests/policy/test_windows_release_downloader.py::test_station_archive_verification_and_safe_extraction[index-mismatch]
          tests/installer/test_install_transaction.py::test_service_restore_rejects_missing_or_unsupported_identity
          """.strip().splitlines()
          code = pytest.main([*nodes, "-q", "-ra", "--no-cov", "--junitxml=junit-windows-installer.xml"])
          if code:
              sys.exit(code)
          cases = list(ET.parse("junit-windows-installer.xml").iter("testcase"))
          assert len(cases) >= len(nodes), "Selected cases did not all execute"
          assert all(not any(c.find(tag) is not None for tag in ("skipped", "failure", "error")) for c in cases), "Selected coverage was skipped or failed"
          print(f"Required coverage executed: {len(cases)} passed, no skips")
          '@ | uv run python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run real native media cases sequentially (no skips)
        timeout-minutes: 20
        shell: pwsh
        run: |
          $env:PSModulePath = "$env:WINDIR\System32\WindowsPowerShell\v1.0\Modules;$env:ProgramFiles\WindowsPowerShell\Modules"
          @'
          import sys, xml.etree.ElementTree as ET
          import os
          from civiccast.native.gstreamer_runtime import bootstrap_installed_gstreamer_runtime, installed_gstreamer_environment
          assert bootstrap_installed_gstreamer_runtime()
          os.environ.update(installed_gstreamer_environment(os.environ["CIVICCAST_GSTREAMER_RUNTIME_ROOT"], base_environment=os.environ))
          import pytest
          nodes = """
