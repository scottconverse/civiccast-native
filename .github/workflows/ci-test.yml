          tests/egress/test_gst_engine_caption_flow_native.py::test_three_captioned_workers_finish_complex_playlist_without_reload
          tests/egress/test_gst_engine_reload_commit_ordering.py::test_u16_diagnostics_print_on_a_real_packaged_pipeline
          tests/egress/test_gst_engine_reload_commit_ordering.py::test_u16_packaged_runtime_resolution_matches_its_declared_root
