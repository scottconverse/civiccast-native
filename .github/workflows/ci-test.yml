      - name: Run tests/native (junit)
        # PR #143 review fix: -m "not integration" excludes
        # test_upgrade_engine_postgres.py's real-Postgres D3 engine proof.
        # That test is Docker+testcontainers-gated, proven on the ubuntu
        # "Unit tests" job (CIVICCAST_RUN_POSTGRES_TESTS=1 there makes an
        # unreachable Docker daemon a hard failure, never a silent skip --
        # see that job's own docker-availability guard step). windows-latest
        # runners do not reliably run Linux containers the way testcontainers
        # needs, so this job -- whose very next step asserts "nothing may
        # skip" -- must not depend on that working; excluding it here is the
        # same pattern the pure (ubuntu, non-Windows-real-hardware) lane
        # already uses for windows_only in the opposite direction.
        run: uv run pytest tests/native -m "not integration" -q --junitxml=junit-native-win.xml

      - name: Assert the full tests/native suite ran on Windows -- nothing may skip
        # windows-latest has no CivicCast WSL distro (wsl.exe itself may even
        # be absent) -- our probes classify that as readable-negative
        # (detect_wsl_install False -> A2 "no CivicCast distro registered")
        # or unreadable (a registered-but-broken distro), never a silent
        # skip. If wsl.exe is missing entirely, probe_indistro_services'
        # FileNotFoundError handling must still classify the same way --
        # verified locally with a PATH-stripped runner stub in
        # test_win_probes.py's FALSIFICATION test. NOTE: this floor assumes
        # a CLEAN windows-latest runner with no pre-existing CivicCast WSL
        # install/keeper process -- 3 real-fire tests
        # (test_probe_keeper_positive_for_real_spawned_flag_process_then_negative_after_kill,
        # test_detect_wsl_install_false_on_this_distro_less_box,
        # test_probe_indistro_services_real_fire_negative_no_distro_registered)
        # assert a distro-less/keeper-less box, which CI's ephemeral runner is
        # but a shared dev box that ALSO runs the live product would not be.
        #
        # 2026-08-30 floor audit: this pin had sat at 1565 unmoved since the
        # repo's first commit (the 1273 pure + 118 windows-only note below it
        # was stale too, dated 2026-07-30) while the real collection grew to
        # 1869 -- 304 tests of undetected slack, found by `git log -S`
        # showing the literal never changed. Floor = the real current full
        # collection count (1869, verified live via `pytest --collect-only
        # tests/native` immediately before this change) minus the same fixed
        # 50-test margin used for the pure-suite floor above, not the exact
        # count itself -- see that floor's comment for the full rationale
        # (NATIVE_JUNIT_FLOOR_MARGIN in
        # tests/policy/test_native_caption_workflow_policy.py) and for why an
        # exact pin is the wrong shape here. The same policy test
        # (test_native_junit_workflow_floors_match_current_exact_collections)
        # re-derives the current count from a fresh collection on every run
        # and fails if this floor drifts more than the margin below it, so
        # this pin cannot go stale again the way 1565 did without failing
        # that test first.
        # 2026-10-09 CI collection audit: 2165 Windows non-integration tests;
        # that checkpoint's 50-test-margin floor was 2115.
        # 2026-10-12 Beta 14 collection: the current Windows non-integration
        # collection is 2193; preserve the same 50-test margin with a floor of
        # 2143.
        # 2026-10-13 station-operations collection: 2256 Windows
        # non-integration tests; preserve the same 50-test margin with a
        # floor of 2206. The 2026-10-14 Beta16 license closure assertion adds
        # one platform-independent test (floor 2207).
        # 2026-10-19 junction and running-image regressions: 2268 non-integration
        # tests; preserve the 50-test margin (2218). The exact native closure
        # baseline regression adds one portable case:2269 non-integration,
        # floor2219 keeps that same margin.
        # Current native CI collection: 2384 Windows non-integration tests;
        # floor 2334 keeps the standard 50-test margin.
        if: always()
        shell: bash
        run: |
          python scripts/verify_native_junit_floor.py \
            --junit junit-native-win.xml \
            --floor 2334 \
            --label "tests/native Windows suite"

      - name: Upload Windows native junit
        if: always()
        uses: actions/upload-artifact@v7.0.1
        timeout-minutes: 10
        with:
          name: windows-native-junit
          path: |
            junit-native-win.xml
            junit-windows-installer.xml
            junit-windows-media.xml
            caption-worker-failure/
          if-no-files-found: error
          retention-days: 1

  external-integration:
    name: Optional agenda imports and network integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      CIVICCAST_RUN_AGENDA_SOURCE_PROOF: "1"
      CIVICCAST_TSDUCK_NETWORK_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install declared optional import dependencies
        # Import/posture proof only; these cases do not launch Chromium.
        run: uv sync --extra agenda-js-import --group dev
      - name: Run optional imports and network cases separately from offline units
        timeout-minutes: 10
        shell: bash
        run: |
          uv run python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          import pytest
          nodes = """
          tests/agenda_import/test_js_portal.py::TestInstalledPostureWhenCrawl4aiIsPresent::test_load_crawl4ai_classes_returns_the_real_classes
          tests/agenda_import/test_js_portal.py::TestInstalledPostureWhenCrawl4aiIsPresent::test_describe_js_portal_runtime_reports_installed_without_raising
          tests/agenda_import/test_live_proof.py::test_seattle_tenant_returns_a_real_nonempty_agenda
          tests/agenda_import/test_live_proof_civicclerk.py::test_portage_tenant_returns_a_real_nonempty_agenda
          tests/agenda_import/test_live_proof_primegov.py::test_longmont_tenant_returns_a_real_nonempty_html_agenda
          tests/agenda_import/test_router.py::TestJsPortalPosture::test_reports_installed_when_crawl4ai_is_present
          tests/installer/test_tsduck_install.py::test_pinned_sha_matches_release[amd64]
          tests/installer/test_tsduck_install.py::test_pinned_sha_matches_release[arm64]
          """.strip().splitlines()
          code = pytest.main([*nodes, "-q", "-ra", "--no-cov", "--junitxml=junit-external-integration.xml"])
          if code:
              sys.exit(code)
          cases = list(ET.parse("junit-external-integration.xml").iter("testcase"))
          assert len(cases) >= len(nodes), "Selected cases did not all execute"
          assert all(not any(c.find(tag) is not None for tag in ("skipped", "failure", "error")) for c in cases), "Selected coverage was skipped or failed"
          print(f"Required coverage executed: {len(cases)} passed, no skips")
          PY

      - name: Upload external integration results
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@v7.0.1
        with:
          name: external-integration-junit
          path: junit-external-integration.xml
          if-no-files-found: error
          retention-days: 1

  claims-verifier:
    name: Claims-evidence verifier
    # ws3 claims-evidence (D3/D7): needs == expected_producers keys exactly
    # (docs/claims/workflow-contract.yaml). if: always() plus explicit
    # per-producer result evaluation below is the fail-closed rule the spec
    # requires ??? a job that `needs` a skipped/failed job would otherwise be
    # skipped itself, silently evading verification (D3).
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project (dev)
        run: uv sync --group dev

      - name: Download producer artifacts
        uses: actions/download-artifact@v7.0.0
        timeout-minutes: 10
        with:
          path: claims-artifacts
          pattern: "*-junit"

      - name: Download producer meta artifacts
        uses: actions/download-artifact@v7.0.0
        timeout-minutes: 10
        with:
          path: claims-artifacts
          pattern: "*-meta"

      - name: Run claims-evidence verifier (same-run mode)
        env:
          # GitHub does not expose needs.*.result as a single JSON blob to
          # `run:` steps; the explicit per-producer env mapping below is the
          # fail-closed evaluation D3 requires (a skipped/failed producer
          # must fail the verifier, never silently skip it).
          CLAIMS_PRODUCER_RESULT_TEST: ${{ needs.test.result }}
          CLAIMS_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PYEOF' > producer-results.json
          import json
          import os

          results = {
              "test": os.environ["CLAIMS_PRODUCER_RESULT_TEST"],
          }
          print(json.dumps(results, indent=2))
          PYEOF
          cat producer-results.json
          uv run python scripts/policy/check_claims_evidence.py \
            --mode same-run \
            --registry docs/claims/claims.yaml \
            --schema docs/claims/claims-schema.json \
            --workflow-contract docs/claims/workflow-contract.yaml \
            --workflow-file .github/workflows/ci-test.yml \
            --artifacts-dir claims-artifacts \
            --producer-results producer-results.json \
            --ci-safe-controls
