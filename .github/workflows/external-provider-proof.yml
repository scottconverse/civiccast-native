# SPDX-License-Identifier: Apache-2.0
name: external-provider-proof

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Run provider proof preflight
        run: python scripts/run_external_provider_proof.py
      - name: Upload redacted provider proof
        uses: actions/upload-artifact@v7.0.1
        timeout-minutes: 10
        with:
          name: v1.1-external-provider-proof
          path: docs/releases/evidence/v1.1-external-provider-proof.md
          retention-days: 7
