# SPDX-License-Identifier: Apache-2.0
name: ai-release-proof

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-ai-proof:
    runs-on: [self-hosted, linux, x64, scott-desktop, rtx]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Run v1.1 AI proof preflight
        run: python scripts/run_real_ai_release_proof.py
      - name: Upload redacted AI proof
        uses: actions/upload-artifact@v7.0.1
        timeout-minutes: 10
        with:
          name: v1.1-ai-release-proof
          path: docs/releases/evidence/v1.1-real-ai-proof.json
          retention-days: 1
