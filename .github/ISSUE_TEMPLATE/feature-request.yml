# SPDX-License-Identifier: CC-BY-4.0
name: Feature request
description: Propose a new capability or enhancement for CivicCast.
title: "[feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        CivicCast follows a strict 0.1 → 1.0 release ladder. Before filing, skim [docs/spec/release-plan.md](../../docs/spec/release-plan.md) to confirm whether your request fits the current ladder, a future rung, or post-1.0.

        For larger architectural proposals, please open an RFC issue instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem you're trying to solve
      description: Who is affected and what they're trying to do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like CivicCast to support this? Be concrete.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about, including third-party tools or workarounds.
  - type: dropdown
    id: rung
    attributes:
      label: Best rung for this work
      description: Per the release plan. "I don't know" is a fine answer.
      options:
        - "0.1 — Foundation"
        - "0.2 — Streaming origin"
        - "0.3 — Assets + scheduling"
        - "0.4 — Live"
        - "0.5 — Captions"
        - "0.6 — Translate / summary"
        - "0.7 — Three-tier publish"
        - "0.8 — Syndicate / podcast"
        - "0.9 — Records / subscribe"
        - "0.10 — Hardening"
        - "1.0 — Release"
        - "Post-1.0"
        - "I don't know"
  - type: textarea
    id: audience
    attributes:
      label: Who benefits
      description: Which audience segment(s) — school boards, HOA boards, local government, public access TV, nonprofits, individual creators?
  - type: checkboxes
    id: scope-check
    attributes:
      label: Confirmation
      options:
        - label: I have read the release plan and confirmed this isn't already scheduled.
          required: true
        - label: I have searched existing issues and this is not a duplicate.
          required: true
