# SPDX-License-Identifier: CC-BY-4.0
name: Bug report
description: Report a defect in CivicCast.
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report. Please **do not** use this template for security vulnerabilities — see [SECURITY.md](../../SECURITY.md) for the private disclosure process.
  - type: input
    id: version
    attributes:
      label: CivicCast version
      description: Output of `civiccast --version` (or commit SHA if running from source).
      placeholder: "0.1.0 / commit abc1234"
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment context
      options:
        - "Windows 11 + WSL2 (Ubuntu 24.04)"
        - "Native Linux (Ubuntu / Debian)"
        - "Native Linux (other distro)"
        - "macOS (Apple Silicon)"
        - "macOS (Intel)"
        - "Docker"
        - "Other (specify in description)"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal reproduction. Include sample data or asset references if relevant.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Output of `civiccast doctor`, server logs, browser console output, or screenshots.
      render: shell
  - type: textarea
    id: workaround
    attributes:
      label: Workaround (if any)
  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: This is not a security vulnerability (those go to SECURITY.md).
          required: true
