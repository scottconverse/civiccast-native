#
# Single source of truth for how docs/USER-MANUAL.md is rendered.
#
# Both renderers use this file so they cannot drift:
#   - scripts/render-user-manual.sh  (used by the ci-docs workflow)
#   - scripts/render_user_manual.py  (used for the tracked docs/ artifacts)
#
# Run pandoc from the repository root so the relative paths below resolve.

pdf-engine: xelatex

toc: true
toc-depth: 2
number-sections: false

include-in-header:
  - docs/assets/manual-style.tex

resource-path:
  - docs

variables:
  documentclass: article
  # Gives \maketitle a standalone cover page instead of crowding the title,
  # the subtitle, and the table of contents onto page 1.
  classoption:
    - titlepage
  papersize: letter
  fontsize: 11pt
  geometry:
    - top=2.4cm
    - bottom=2.4cm
    - left=2.6cm
    - right=2.6cm
  # Brand typography (docs/brand/BRAND.md): Barlow for text, Barlow Condensed for
  # headings. The font files are checked in under docs/assets/fonts/barlow (SIL OFL)
  # and loaded by path, so no font has to be installed on the build machine.
  # Code stays in Liberation Mono. pandoc runs from the repository root.
  mainfont: Barlow
  mainfontoptions:
    - Path=docs/assets/fonts/barlow/
    - Extension=.ttf
    - UprightFont=Barlow-Regular
    - BoldFont=Barlow-Bold
    - ItalicFont=Barlow-Italic
    - BoldItalicFont=Barlow-BoldItalic
  sansfont: Barlow Condensed
  sansfontoptions:
    - Path=docs/assets/fonts/barlow/
    - Extension=.ttf
    - UprightFont=BarlowCondensed-Regular
    - BoldFont=BarlowCondensed-SemiBold
    - ItalicFont=BarlowCondensed-Regular
    - BoldItalicFont=BarlowCondensed-SemiBold
  monofont: Liberation Mono
  colorlinks: true
  # Quoted: unquoted "[HTML]{...}" parses as a YAML list, not a hyperref spec.
  linkcolor: "[HTML]{416180}"
  urlcolor: "[HTML]{416180}"
  toccolor: "[HTML]{1D2D3D}"
  secnumdepth: 0
