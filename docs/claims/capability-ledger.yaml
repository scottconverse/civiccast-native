# Capability ledger — the anti-amnesia record for the native Windows beta.
#
# PURPOSE. The audit rule "verdicts never carry across SHAs" is correct for
# release gating and catastrophic for memory: across sessions it degraded
# "unproven at the current SHA" into "never done," and agents re-planned and
# re-built capabilities this project had already proven (full audit:
# TRUE-STATE-REVIEW-2026-08-08). This file carries the HISTORY so no future
# session can un-know it. It is additive to docs/claims/claims.yaml and is
# deliberately NOT validated by scripts/policy/check_claims_evidence.py —
# claims.yaml binds gate verdicts at exact SHAs; this ledger records, for
# every beta capability, when it was last proven anywhere and where it
# stands against the CURRENT candidate.
#
# SCHEMA (per entry):
#   last_proven:      {sha, date, evidence} — most recent proof at ANY sha,
#                     any venue. evidence is a repo path, a branch-qualified
#                     path (branch:path), or a local evidence-tree path.
#   current_candidate_status: proven | stale | never
#     proven — demonstrated at the CURRENT release head (or a build of it),
#              with evidence committed in this repo. Nothing less.
#     stale  — proven at an older sha, an older built candidate, or another
#              lane; needs re-binding at the current candidate, not
#              re-building. bound_at names the sha the proof belongs to.
#     never  — no completed proof exists anywhere (rebuild/prove for real)
#
#   NOTE (2026-08-08): release head 99b1ce4b has NO built candidate yet
#   (its artifact build was cancelled) — so every capability proven on the
#   923fad14 build lineage is `stale` by this definition and re-binds
#   automatically when slice-b1 gates the rebuilt candidate. This encoding
#   is deliberate, per Codex review on PR #382: a `proven` that outruns its
#   sha is exactly the overclaim this file exists to prevent.
#   rebind: the beta slice that re-proves it (see
#           civiccast-lifecycle-workflow/beta/beta-slices.yaml on the host)
#
#   NOTE (2026-08-13): PR #389 (the B5 supervisor reconciliation-latch fix)
#   merged to release/native-beta-1.0.0-beta.1-rc1 as 3e3356dee. This is
#   deliberately NOT recorded as a new gate_passes/release_head entry below
#   — no gate has run against it and no capability in this file has direct
#   evidence AT that sha yet. A candidate build is in flight (workflow run
#   31687880719); TESTER1's request-0082 Part 1 verify leg targets it.
#   Every entry below still carries only the sha its OWN evidence names —
#   per this file's own rule, do not re-bind a row to 3e3356dee without a
#   proof committed at that sha.
#
# RULES. Update this file in the same commit as the evidence that changes a
# status. A status may only move to `proven` alongside evidence at the
# candidate sha. Moving a capability to `never` requires a NOT-FOUND search
# transcript, not an agent's recollection.

