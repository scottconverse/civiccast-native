# SPDX-License-Identifier: Apache-2.0
# Release-truth manifest — the SOLE AUTHORED SOURCE for CivicCast release state.
# (Native-Windows program WS1; charter section 3 in civiccast-audit-control.)
#
# Rules:
# - Human-facing release claims (README, docs, announcements) are checked
#   AGAINST this file by scripts/policy/check_release_truth.py; never the
#   reverse. Edit this file first, then the prose.
# - Exactly one entry has status `current`. Every `withdrawn` entry names its
#   superseding tag. A live GitHub release whose tag is neither listed here
#   nor matched by `historical_unlisted_patterns` is DRIFT and must be added.
# - `staging` = published release whose own page says not to install yet
#   (assets/verification pending); it flips to `current` when that clears.
# - This manifest carries release STATE, not release evidence; evidence stays
#   in docs/releases/ verification documents and release assets.

schema_version: 1
# Was scottconverse/civiccast. This manifest governs THIS repository's
# release state; pointing it at the archived repo would have made every
# release claim here checked against a line this repo does not ship.
repository: scottconverse/civiccast-native

# The tag that public surfaces may present as the current install target.
current: v1.0.0-beta.18
# Live tags matching these regexes predate this manifest and are exempt from
# per-entry listing (they remain visible on GitHub as history). Anything else
# unlisted is drift.
# Covers the pre-reset era and the old 0.x-2.x numbering; the live line this
# manifest governs is v1.0.0-rc*. Listed entries always take precedence over
# these exemptions.
historical_unlisted_patterns:
  - '^pre-reset-'
  - '^v0\.'
  - '^v1\.[1-9]'
  - '^v2\.'
  - '^v3\.'
  - '^v4\.0\.0-rc\.'

