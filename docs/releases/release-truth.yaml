# SPDX-License-Identifier: Apache-2.0
# Release-truth manifest — the SOLE AUTHORED SOURCE for CivicCast release state.
# (Native-Windows program WS1; charter section 3 in civiccast-audit-control.)
#
# Rules:
# - Human-facing release claims (README, docs, announcements) are checked
#   AGAINST this file by scripts/policy/check_release_truth.py; never the
#   reverse. Edit this file first, then the prose.
# - Exactly one entry has status `current`. Every `withdrawn` entry names its
#   superseding tag. A live GitHub release whose tag is neither listed here
#   nor matched by `historical_unlisted_patterns` is DRIFT and must be added.
# - `staging` = published release whose own page says not to install yet
#   (assets/verification pending); it flips to `current` when that clears.
# - This manifest carries release STATE, not release evidence; evidence stays
#   in docs/releases/ verification documents and release assets.

schema_version: 1
# Was scottconverse/civiccast. This manifest governs THIS repository's
# release state; pointing it at the archived repo would have made every
# release claim here checked against a line this repo does not ship.
repository: scottconverse/civiccast-native

# The tag that public surfaces may present as the current install target.
current: v1.0.0-beta.3

# Live tags matching these regexes predate this manifest and are exempt from
# per-entry listing (they remain visible on GitHub as history). Anything else
# unlisted is drift.
# Covers the pre-reset era and the old 0.x-2.x numbering; the live line this
# manifest governs is v1.0.0-rc*. Listed entries always take precedence over
# these exemptions.
historical_unlisted_patterns:
  - '^pre-reset-'
  - '^v0\.'
  - '^v1\.[1-9]'
  - '^v2\.'
  - '^v3\.'
  - '^v4\.0\.0-rc\.'

entries:
  # Native-Windows program (civiccast-native, THIS repository). Owner
  # decision 2026-09-02: the coordinating agent cuts beta-candidate releases
  # going forward via scripts/release/publish_beta_candidate.py; every green
  # build gets tagged and published as a GitHub pre-release because the beta
  # tester (Sergio, "LPM") checks GitHub daily.
  - tag: v1.0.0-beta.4
    status: staging
    notes: >-
      Owner-held candidate as of this entry; NOT YET PUBLISHED by this
      change. Release-prep bump: product version moves from v1.0.0-beta.3 to
      v1.0.0-beta.4 across every check_release_identity.py-bound surface, and
      sandbox-lab/upgrade-baseline.json is repinned from the beta.2 internal
      kit to the published beta.3 kit (source SHA
      9573d4a82e1e1d9993589f633bad6dacba792afb, build run 33711079441, Gate A
      run 33713004718) so Gate A's cross-version and download-only lanes have
      the actual current published release as their prior build. Flips to
      current, with the v1.0.0-beta.3 entry's status flipped to
      superseded_by v1.0.0-beta.4, only once an actual publish lands and a
      human/agent updates this file to match -- this manifest is the SOLE
      AUTHORED SOURCE and is never inferred from what "should" be live.
  - tag: v1.0.0-beta.3
    status: current
    notes: >-
      The first downloadable CivicCast release. Published by
      publish_beta_candidate.py from source SHA
      9573d4a82e1e1d9993589f633bad6dacba792afb, build run 33711079441, Gate A
      run 33713004718 (clean, cross-version-upgrade, and download-only lanes
      all PASS against the beta.2 upgrade baseline). GitHub Release assets:
      setup.exe (sha256 76df8f3bcc5e6b20a41448cddae8a3433e088ebd821a81870b4e40ea052492dc,
      Authenticode Valid, verified publisher Scott Converse) plus the five
      runtime .ccpack packs (native-app-payload, native-cuda-runtime,
      native-ffmpeg-runtime, native-ollama-runtime, native-server-binaries),
      SHA256SUMS.txt, and setup.exe.sidecar.json -- every asset under
      GitHub's 2 GB/file cap. The ~21 GB station\ AI-model bundle is
      deliberately NOT a release asset: a beta.1 station does one fresh
      install from a USB/LAN-delivered kit (the one-time beta.1 -> beta.3
      path), and every install from beta.3 onward can upgrade in place by
      downloading only setup.exe + packs, reusing AI models already present
      on the machine. See docs/releases/2026-09-03-beta3-first-downloadable-release.md.
  - tag: v1.0.0-beta.1
    status: superseded
    superseded_by: v1.0.0-beta.3
    notes: >-
      Native line's first published prerelease. USB-delivered only -- the
      GitHub Release carries no downloadable assets (the ~21 GB AI-model
      bundle exceeds GitHub's 2 GB/file asset cap, and no publish tooling
      existed yet to split runtime packs from the model bundle). Current by
      default until a downloadable beta candidate actually publishes.
  - tag: v1.0.0-beta.2
    status: historical
    notes: >-
      Internal baseline kit, never published. Built (run 33621209994, source
      SHA 564ee028cf712e26133ada9d7c25b498abe605ab) to validate the
      download-only install/upgrade workstream (PR #124-#127); Gate A run
      33623737236 found its download-only lane FAILS a beta.1-station upgrade
      (installer exit 123, activation code 66 -- the new stable-pack-identity
      change has no migration bridge for a station already activated on the
      old pack bytes). Owner decision 2026-09-02: beta.2 stays permanently
      unpublished and unreleasable -- it exists solely as
      `sandbox-lab/upgrade-baseline.json`'s pinned "immutable previous
      candidate" so Gate A's cross-version and download-only lanes have a
      real prior build to upgrade from. See
      `docs/releases/2026-09-02-beta1-to-beta2-fresh-install-only.md`. No
      GitHub release/tag exists or will exist for this entry; a live-mode
      run of `check_release_truth.py` against this manifest is expected to
      report it as having no matching live release for exactly that reason.
  # Below: the retired, separate WSL2-line product (scottconverse/civiccast,
  # NOT this repository). None of these tags are live releases on
  # civiccast-native; retained here only because prior entries already
  # existed at the time this manifest was repointed to the native repo (see
  # the `repository:` field above) and removing them outright would discard
  # a record of what was already tracked. A native-line reader must never
  # treat any v1.0.0-rcNN entry below as a current or installable target on
  # this repository.
  - tag: v1.0.0-rc15
    status: historical
    notes: >-
      Retired WSL2-line release (scottconverse/civiccast, a different
      repository) -- NOT a civiccast-native release. Kept as a historical
      record only; was incorrectly carried as this manifest's `current` entry
      before 2026-09-02 even though this manifest's `repository:` field
      already named civiccast-native. Public beta; assets and clean-Windows
      walkthrough proof landed 2026-07-17, do-not-install notice cleared,
      flipped from staging (on the WSL2 line).
  - tag: v1.0.0-rc14
    status: superseded
    superseded_by: v1.0.0-rc15
    notes: Windows repair public beta; superseded the withdrawn rc13.
  - tag: v1.0.0-rc13
    status: withdrawn
    superseded_by: v1.0.0-rc14
    notes: >-
      Withdrawn after a genuinely clean Windows test exposed bootstrap
      failures the earlier contaminated lab run did not catch. Retained as
      incident history; release page carries the WITHDRAWN caution.
  - tag: v1.0.0-rc12
    status: superseded
    superseded_by: v1.0.0-rc13
  - tag: v1.0.0-rc11
    status: superseded
    superseded_by: v1.0.0-rc12
  - tag: v1.0.0-rc10
    status: superseded
    superseded_by: v1.0.0-rc11
  - tag: v1.0.0-rc9
    status: superseded
    superseded_by: v1.0.0-rc10
  - tag: v1.0.0-rc8
    status: superseded
    superseded_by: v1.0.0-rc9
  - tag: v1.0.0-rc7
    status: superseded
    superseded_by: v1.0.0-rc8
    notes: Completed the 41-row readiness ledger (see rc7 verification doc).
  # NOTE: no v1.0.0-rc6 release exists on GitHub (the rc line runs rc5 -> rc7).
  - tag: v1.0.0-rc5
    status: superseded
    superseded_by: v1.0.0-rc7
  - tag: v1.0.0-rc4
    status: superseded
    superseded_by: v1.0.0-rc5
  - tag: v1.0.0-rc3
    status: superseded
    superseded_by: v1.0.0-rc4
  - tag: v1.0.0-rc2
    status: superseded
    superseded_by: v1.0.0-rc3
  - tag: v1.0.0-rc1
    status: superseded
    superseded_by: v1.0.0-rc2
    notes: Known first-run dead-end; fixed in rc2.
  - tag: v0.2.0
    status: historical
    notes: Live Delivery at Scale milestone; evidence cited from README.
  - tag: v0.1.0-rc6
    status: historical
    notes: Clean-Windows install + video proof milestone; evidence cited from README.
