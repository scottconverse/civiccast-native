#
# Alembic single-config for the CivicCast monorepo. Per ADR 0008:
# one alembic.ini + one alembic/env.py at the repo root; per-module
# migration directories under civiccast/<module>/migrations/versions/
# are discovered at runtime by alembic/env.py. The reserved
# alembic/versions/ slot at the repo root is included in the
# discovery set but the convention is to keep new migrations in their
# owning module's directory.
#
# The sqlalchemy.url is interpolated from the DATABASE_URL env var so
# operators do not have to mirror the connection string into this file.
# Tests override the URL programmatically via Config.set_main_option.

[alembic]
script_location = alembic
sqlalchemy.url =

# version_locations enumerates the reserved repo-root slot AND every
# per-module migrations/versions/ directory. Alembic's ScriptDirectory
# is built from this list BEFORE env.py runs, so it has to live in the
# ini (or be set on the Config before command.upgrade is invoked).
# Honest note (audit ENG-010): env.py re-passes a discovery walk into
# context.configure but does NOT compare it against this list - the
# drift guard is tests/test_alembic_ini_sync.py, which pins this list
# to the packaged copy and to the on-disk module directories.
#
# Add the new module's path here when its first migration lands. The
# ``path_separator = os`` setting means the per-platform separator is
# used (`;` on Windows, `:` on Unix); both work with absolute paths
# resolved via ``%(here)s``.
version_locations =
    %(here)s/alembic/versions
    %(here)s/civiccast/schedule/migrations/versions
    %(here)s/civiccast/live/migrations/versions
    %(here)s/civiccast/summary/migrations/versions
    %(here)s/civiccast/records/migrations/versions
    %(here)s/civiccast/publish/migrations/versions
    %(here)s/civiccast/subscribe/migrations/versions
    %(here)s/civiccast/podcast/migrations/versions
    %(here)s/civiccast/auth/migrations/versions
    %(here)s/civiccast/activitypub/migrations/versions
    %(here)s/civiccast/egress/migrations/versions
    %(here)s/civiccast/captions/migrations/versions
    %(here)s/civiccast/programlog/migrations/versions
    %(here)s/civiccast/cg/migrations/versions
    %(here)s/civiccast/alerting/migrations/versions
    %(here)s/civiccast/control_room/migrations/versions
    %(here)s/civiccast/eas/migrations/versions
    %(here)s/civiccast/ai_models/migrations/versions
    %(here)s/civiccast/metadata/migrations/versions
    %(here)s/civiccast/reporting/migrations/versions
    %(here)s/civiccast/underwriting/migrations/versions
    %(here)s/civiccast/agenda/migrations/versions
    %(here)s/civiccast/paywall/migrations/versions
    %(here)s/civiccast/recording/migrations/versions
    %(here)s/civiccast/producer_ops/migrations/versions
    %(here)s/civiccast/migrate/migrations/versions
    %(here)s/civiccast/agenda_import/migrations/versions
    %(here)s/civiccast/analytics/migrations/versions

prepend_sys_path = .
path_separator = newline

[post_write_hooks]
# No post-write hooks at task 1a. Future migrations may add ruff/format
# hooks once the per-module-migration lint posture is settled (tracked
# in next-cleanup.md per director-decisions §2 Compliance).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
