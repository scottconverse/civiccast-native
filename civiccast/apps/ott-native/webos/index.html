<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1920, height=1080, user-scalable=no" />
  <title>CivicCast</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      background: #1a1a1a;
      color: #fff;
      font-family: "LG Smart UI", -apple-system, sans-serif;
    }
    [data-civiccast-app] { padding: 60px; }
    h1 { margin: 0 0 4px; }
    [data-role="platform-label"] { color: #aaa; margin-top: 0; }
    [data-role="video"] { width: 100%; max-width: 1600px; background: #000; }
    [data-role="channel-list"] { list-style: none; padding: 0; display: flex; gap: 16px; flex-wrap: wrap; }
    [data-role="channel-list"] button {
      padding: 12px 20px;
      background: var(--civiccast-brand, #2458A6);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 20px;
      cursor: pointer;
    }
    [data-role="channel-list"] button:focus { outline: 4px solid #ffcc00; }
    [data-role="station-logo"] { max-width: 180px; max-height: 90px; object-fit: contain; }
    [data-role="channel-list"] img { width: 56px; height: 56px; object-fit: contain; vertical-align: middle; margin-right: 12px; }
    [data-role="catalog-list"] { list-style: none; padding: 0; display: flex; gap: 16px; flex-wrap: wrap; }
    [data-role="catalog-list"] button { width: 240px; min-height: 180px; background: #292929; color: #fff; border: 2px solid #666; border-radius: 6px; font-size: 20px; cursor: pointer; }
    [data-role="catalog-list"] img { width: 100%; height: 125px; object-fit: cover; display: block; }
    input, select { padding: 12px; font-size: 20px; background: #292929; color: #fff; border: 2px solid #aaa; margin: 8px 12px 8px 0; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 4px solid #ffcc00; outline-offset: 3px; }
  </style>
</head>
<body>
  <div data-civiccast-app data-platform-label="CivicCast — LG webOS"></div>

  <!--
    civiccast-player.js is NOT checked in here — it is copied in from the
    single canonical copy at ../web-shared/civiccast-player.js (shared with
    ../tizen/) by the CI build step (.github/workflows/ci-ott-apps.yml)
    before `ares-package` runs. It must land in THIS directory (same-dir
    import below) because a packaged .ipk is sandboxed to its own folder at
    runtime. For local dev: `cp ../web-shared/civiccast-player.js .` once,
    then open this file via a static server (ES module imports need
    http(s), not file://).
  -->
  <script type="module">
    import { bootPlayer } from './civiccast-player.js'
    bootPlayer({ platformLabel: 'CivicCast — LG webOS' })
  </script>
</body>
</html>
